<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#bfe3f2">
<title>Bodensee Builder</title>
<style>
  :root {
    --blue: #2f7fb5;
    --blue-dark: #1d5a85;
    --green: #6cbf4a;
    --ink: #24384a;
    --muted: #6b7f90;
    --panel: rgba(255, 255, 255, 0.94);
    --shadow: 0 6px 24px rgba(20, 50, 80, 0.18);
    --gold: #f2b631;
    --pearl: #b9a6e8;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #bfe3f2; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none; touch-action: none;
  }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* Topbar */
  #topbar {
    position: fixed; left: 0; right: 0; top: 0;
    padding: calc(var(--safe-top) + 8px) 10px 8px;
    display: flex; gap: 8px; justify-content: center; pointer-events: none; z-index: 5;
  }
  .chip {
    pointer-events: auto; background: var(--panel); border-radius: 999px; box-shadow: var(--shadow);
    padding: 6px 12px 6px 6px; display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 0;
  }
  .chip .ico { width: 24px; height: 24px; flex: none; }
  .chip small { font-weight: 600; color: var(--muted); font-size: 12px; }

  /* Bottom bar */
  #bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 8px 8px calc(var(--safe-bottom) + 8px);
    display: flex; justify-content: center; pointer-events: none;
  }
  #bottombar .bar {
    pointer-events: auto; display: flex; gap: 2px; background: var(--panel); border-radius: 20px;
    box-shadow: var(--shadow); padding: 4px; max-width: 520px; width: 100%;
  }
  #bottombar button {
    flex: 1; border: 0; background: transparent; border-radius: 16px; padding: 6px 2px 5px;
    font: inherit; font-size: 11px; font-weight: 600; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  }
  #bottombar button:active { background: rgba(47, 127, 181, 0.12); }
  #bottombar button svg { width: 26px; height: 26px; }

  /* Bottom sheet */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    transform: translateY(110%); transition: transform 0.25s cubic-bezier(.2,.8,.2,1);
    display: flex; justify-content: center; pointer-events: none;
  }
  #sheet.open { transform: translateY(0); }
  #sheet .inner {
    pointer-events: auto; background: #fff; width: 100%; max-width: 560px;
    border-radius: 22px 22px 0 0; box-shadow: 0 -8px 30px rgba(20, 50, 80, 0.2);
    padding: 10px 18px calc(var(--safe-bottom) + 18px);
    max-height: 88vh; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
  }
  .grip { width: 40px; height: 5px; border-radius: 3px; background: #d5dde4; margin: 0 auto 10px; }
  .sheet-head { display: flex; align-items: center; gap: 12px; }
  .sheet-head .badge {
    width: 52px; height: 52px; border-radius: 14px; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-head h2 { margin: 0; font-size: 19px; }
  .sheet-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .sheet-body { margin-top: 12px; font-size: 14px; line-height: 1.45; }
  .sheet-body .note { color: var(--muted); font-size: 13px; }
  .stars { display: flex; gap: 4px; margin: 8px 0; }
  .stars span { flex: 1; height: 8px; border-radius: 4px; background: #e3e9ee; }
  .stars span.on { background: var(--gold); }
  .bigbtn {
    margin-top: 14px; width: 100%; border: 0; border-radius: 16px; padding: 14px;
    font: inherit; font-size: 17px; font-weight: 800; color: #fff; background: var(--green);
    box-shadow: 0 4px 0 #4f9a33; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
  }
  .bigbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4f9a33; }
  .bigbtn[disabled] { background: #c4ccd3; box-shadow: 0 4px 0 #a7b0b8; cursor: default; }
  .bigbtn .ico { width: 22px; height: 22px; }
  .missing { text-align: center; color: #c0503f; font-size: 13px; font-weight: 600; margin-top: 8px; min-height: 18px; }
  .secbtn {
    margin-top: 10px; width: 100%; border: 0; border-radius: 14px; padding: 12px;
    font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); background: #eef2f5; cursor: pointer;
  }
  .secbtn.danger { color: #b33b2c; }

  /* Modal */
  #modal {
    position: fixed; inset: 0; z-index: 20; background: rgba(20, 40, 60, 0.35);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #modal.open { display: flex; }
  #modal .box {
    background: #fff; border-radius: 22px; box-shadow: var(--shadow); width: 100%; max-width: 420px;
    padding: 18px; max-height: 80vh; overflow: auto;
  }
  #modal h2 { margin: 0 0 10px; font-size: 20px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eef2f5; font-size: 15px; }
  .toggle { width: 52px; height: 30px; border-radius: 15px; background: #c9d2da; position: relative; border: 0; cursor: pointer; transition: background .2s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .toggle.on { background: var(--green); }
  .toggle.on::after { left: 25px; }

  /* Toast */
  #toast {
    position: fixed; left: 50%; top: calc(var(--safe-top) + 62px); z-index: 30;
    transform: translate(-50%, -20px); opacity: 0; transition: all .25s;
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
  #toast.show { opacity: 0.95; transform: translate(-50%, 0); }

  /* Loader */
  #loader {
    position: fixed; inset: 0; z-index: 40; background: linear-gradient(#bfe3f2, #e7f4fa);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    transition: opacity .5s;
  }
  #loader h1 { margin: 0; font-size: 30px; color: var(--blue-dark); letter-spacing: .5px; }
  #loader p { margin: 0; color: var(--muted); font-style: italic; }
  #loader.hide { opacity: 0; pointer-events: none; }

  /* Wirtschaft (M2) */
  #modal .box, .cards { touch-action: pan-y; }
  .io { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; background: #f5f8fa; border-radius: 14px; padding: 9px 11px; margin-top: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; background: #fff; border-radius: 999px; padding: 3px 9px; font-weight: 700; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .arrow { color: var(--muted); font-weight: 800; font-size: 13px; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .kv b { color: var(--ink); }
  .kv .up { color: #3e8f25; }
  .status { margin-top: 8px; font-size: 13px; font-weight: 700; }
  .status.bad { color: #c0503f; } .status.ok { color: #3e8f25; } .status.idle { color: var(--muted); }
  .cards { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 46vh; overflow: auto; }
  .card { display: flex; align-items: center; gap: 10px; border: 1px solid #e6ecf0; border-radius: 16px; padding: 10px; }
  .card .ic { font-size: 26px; width: 36px; text-align: center; flex: none; }
  .card .mid { flex: 1; min-width: 0; }
  .card .mid b { display: block; font-size: 15px; }
  .card .mid small { color: var(--muted); font-size: 12px; display: block; }
  .card .mid small.warn { color: #c0503f; }
  .card button { border: 0; border-radius: 12px; padding: 9px 10px; font: inherit; font-weight: 800; font-size: 14px; color: #fff; background: var(--green); box-shadow: 0 3px 0 #4f9a33; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; flex: none; }
  .card button[disabled] { background: #c4ccd3; box-shadow: 0 3px 0 #a7b0b8; cursor: default; }
  .card button .ico, .goodrow .ico { width: 18px; height: 18px; }
  .goodrow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #eef2f5; }
  .goodrow .ic { font-size: 22px; width: 30px; text-align: center; flex: none; }
  .goodrow .mid { flex: 1; min-width: 0; font-size: 15px; }
  .goodrow small { color: var(--muted); display: block; font-size: 12px; font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  textarea { width: 100%; height: 110px; border-radius: 12px; border: 1px solid #d5dde4; padding: 10px; font: 12px ui-monospace, Menlo, monospace; resize: none; -webkit-user-select: text; user-select: text; touch-action: auto; word-break: break-all; }
  .big-num { font-size: 30px; font-weight: 800; text-align: center; margin: 6px 0 2px; display: flex; justify-content: center; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .big-num .ico { width: 30px; height: 30px; }
  .center { text-align: center; }

  /* Meta (M3) */
  #bottombar button { position: relative; }
  #bottombar button .dot { position: absolute; top: 3px; right: calc(50% - 20px); width: 10px; height: 10px; border-radius: 50%; background: #e8573f; box-shadow: 0 0 0 2px #fff; display: none; }
  #bottombar button .dot.on { display: block; }
  #goalBanner {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 76px); z-index: 4; transform: translateX(-50%);
    width: calc(100% - 24px); max-width: 500px; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow);
    padding: 8px 12px; display: none; align-items: center; gap: 10px; cursor: pointer; font-size: 13px;
  }
  #goalBanner.show { display: flex; }
  #goalBanner.done { background: #fff6d8; box-shadow: 0 0 0 2px var(--gold), var(--shadow); }
  #goalBanner .gi { font-size: 22px; flex: none; }
  #goalBanner .gm { flex: 1; min-width: 0; }
  #goalBanner b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #goalBanner small { color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar2 { height: 6px; border-radius: 3px; background: #e3e9ee; overflow: hidden; margin-top: 4px; }
  .bar2 i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
  .bar2.pearl i { background: #9b86de; }
  .bar2.red i { background: #e8735a; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 8px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 8px; font: inherit; font-weight: 700; font-size: 14px; background: #eef2f5; color: var(--ink); cursor: pointer; }
  .tabs button.on { background: var(--blue); color: #fff; }
  .card button.pearl { background: #9b86de; box-shadow: 0 3px 0 #7a64c2; }
  .card.done { border-color: var(--gold); background: #fffaea; }
  .card.claimed { opacity: .5; }
  .chain { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; padding: 8px 0; border-bottom: 1px solid #eef2f5; }
  .chain .pill { flex-direction: column; align-items: flex-start; border-radius: 12px; padding: 4px 8px; gap: 0; }
  .chain .pill small { font-weight: 600; font-size: 11px; color: var(--muted); }
  .chain .pill.bad { box-shadow: 0 0 0 2px #e8735a; }
  .chain .pill.off { opacity: .45; }
  .warnline { color: #c0503f; font-size: 12px; font-weight: 600; width: 100%; }
  .cargo { margin-top: 8px; }
  .cargo .goodrow { padding: 6px 0; }
</style>
</head>
<body>
<canvas id="map" aria-label="Spielkarte"></canvas>

<div id="topbar">
  <div class="chip" id="chipCoins"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f2b631"/><circle cx="12" cy="12" r="7" fill="#f7cd5c"/><path d="M9 12h6M12 9v6" stroke="#c98f12" stroke-width="2" stroke-linecap="round"/></svg><span id="coins">0</span></div>
  <div class="chip" id="chipPearls"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#cbbcf0"/><circle cx="9" cy="9" r="3" fill="#fff" opacity=".8"/></svg><span id="pearls">0</span></div>
  <div class="chip"><span id="income">0</span><small>/s</small></div>
</div>

<div id="bottombar"><div class="bar">
  <button data-act="upgrades"><svg viewBox="0 0 24 24" fill="none" stroke="#2f7fb5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Upgrades<i class="dot" id="dotUpgrades"></i></button>
  <button data-act="balloons"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 4 4 7 6 9h2c2-2 6-5 6-9a7 7 0 0 0-7-7z" fill="#e8735a"/><path d="M12 2c-2 2-3 5-3 7s1 6 2 9h2c1-3 2-7 2-9s-1-5-3-7z" fill="#f4b740"/><rect x="10" y="19" width="4" height="3" rx="1" fill="#8a5a33"/></svg>Ballons<i class="dot" id="dotBalloons"></i></button>
  <button data-act="market"><svg viewBox="0 0 24 24"><path d="M3 9l2-5h14l2 5z" fill="#e8735a"/><rect x="4" y="9" width="16" height="11" rx="1" fill="#f3e3c3"/><rect x="10" y="13" width="4" height="7" fill="#8a5a33"/></svg>Lager</button>
  <button data-act="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#e8735a"/><circle cx="12" cy="12" r="6" fill="#fff"/><circle cx="12" cy="12" r="3" fill="#e8735a"/></svg>Ziele<i class="dot" id="dotGoals"></i></button>
  <button data-act="settings"><svg viewBox="0 0 24 24" fill="none" stroke="#6b7f90" stroke-width="2.2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" stroke-linecap="round"/></svg>Optionen</button>
</div></div>

<div id="goalBanner"><div class="gi">🎯</div><div class="gm"><b id="gbText"></b><small id="gbSub"></small><div class="bar2"><i id="gbBar"></i></div></div></div>
<div id="sheet"><div class="inner" id="sheetInner"></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="loader"><h1>Bodensee Builder</h1><p id="loaderQuote">Felder werden vermessen …</p></div>

<script>
'use strict';
/* =====================================================================
 * 1. CONFIG – alle Spielwerte zentral
 * ===================================================================== */
const CONFIG = {
  saveVersion: 4,
  saveKey: 'bodenseeBuilder.save',
  autosaveSeconds: 10,
  tickRate: 10,                 // Simulation in Hz
  maxTicksPerFrame: 50,

  grid: {
    side: 40,                   // Kantenlänge s (Welteinheiten)
    tilt: 0.72,                 // y-Stauchung für 2,5D
    depth: 9,                   // Plattentiefe (Welteinheiten)
  },
  camera: {
    minZoom: 0.45, maxZoom: 3.2, // relativ zur "passt auf Bildschirm"-Zoomstufe
    startZoom: 1.25,
    friction: 0.9,               // Pan-Trägheit pro Frame
    tapSlop: 8,                  // px bis aus Tap ein Pan wird
  },

  start: { pearls: 0 },          // Startmünzen und Freischaltkosten stehen pro Region in regions[]

  // Ausbaustufen: Kosten upBase × costGrowth^(level−1)
  levels: {
    max: 6,
    costGrowth: 1.9,
    speed: [1, 1.1, 1.25, 1.4, 1.6, 1.8],    // Tempo-Faktor je Stufe (Zykluszeit ÷ Faktor)
    yield: [1, 2, 2, 3, 4, 5],               // Einheiten pro Zyklus (Verarbeitung: max. Chargengröße)
  },
  // Verarbeitungsbetrieb bauen: build × buildGrowth^(Anzahl gleicher Betriebe)
  buildGrowth: 1.5,
  storage: { cap: 100 },                     // Lagerplatz pro Ware
  // Marktplatz (Altstadt): Gebühren-Einkommen und Verkaufsbonus je Stufe
  market: { tax: [0.5, 1, 2, 4, 7, 12], bonus: [0, 0.1, 0.2, 0.35, 0.5, 0.75] },
  offline: { capHours: 2, minSeconds: 30, stepSeconds: 0.5, maxSteps: 20000 }, // lange Abwesenheit: gröbere Schritte (8 h → 1,44 s)
  // Globale Upgrades (Seeperlen, bleiben über alle Regionen erhalten). Kosten: base × growth^Stufe
  meta: {
    speed: { name: 'Tempo', icon: '⚡', step: 0.25, max: 5, base: 5, growth: 2.2 },   // +25 % Tempo je Stufe für alle Betriebe dieser Ware
    price: { name: 'Preis', icon: '💰', step: 0.2, max: 5, base: 6, growth: 2.2 },    // +20 % Verkaufspreis je Stufe
    special: {
      offline: { name: 'Nachtschicht', icon: '🌙', desc: '+1 h Offline-Ertrag', step: 1, max: 6, base: 5, growth: 1.6 },
      storage: { name: 'Großes Lager', icon: '📦', desc: '+50 Lagerplatz pro Ware', step: 50, max: 5, base: 4, growth: 1.6 },
      startCoins: { name: 'Startkapital', icon: '👛', desc: '+150 Münzen beim Start jeder Region', step: 150, max: 5, base: 6, growth: 1.8 },
    },
  },
  // Ballonstation: Ladetempo (Einheiten/s je Ware), Belohnungen je Stufe
  balloon: {
    rate: [2, 3, 4, 6, 8, 10],
    pearls: [1, 2, 2, 3, 3, 4],      // Seeperlen pro Start (+1 je 4 bisherige Starts)
    pearlsEvery: 4,
    reveal: [1, 1, 1, 1, 1, 2],      // Nebelfelder, die pro Start kostenlos aufgedeckt werden
    coinMult: 1.5,                   // Münzbonus = Warenwert × coinMult × (1 + levelCoin × (Stufe−1))
    levelCoin: 0.2,
    needGrowth: 1.35,                // Ladung wächst je Start
    flightMs: 4200,
  },
  // Luftschiff: Ladetempo (Einheiten/s je Ware) und Dauer der Flug-Animation
  airship: { rate: 8, flightMs: 3800, fadeMs: 900 },
  transport: { speed: 110, minSeconds: 0.7, maxSeconds: 3, maxDots: 80 },
  popupEveryMs: 1100,           // Münz-Popups pro Feld höchstens so oft
  incomeSmoothing: 0.015,       // Glättung der Einkommensanzeige pro Tick
  debugCoins: 1000,             // nur mit #debug in der URL

  fogClearMs: 900,

  goods: {
    wood:      { name: 'Holz',    icon: '🪵', price: 2,   color: '#a0703f' },
    planks:    { name: 'Bretter', icon: '🪚', price: 14,  color: '#e0aa62' },
    furniture: { name: 'Möbel',   icon: '🪑', price: 110, color: '#8a4f2a' },
    gravel:    { name: 'Kies',    icon: '🪨', price: 3,   color: '#9a948a' },
    concrete:  { name: 'Beton',   icon: '🧱', price: 38,  color: '#6f7b86' },
    milk:      { name: 'Milch',   icon: '🥛', price: 4,   color: '#fbfbf4' },
    butter:    { name: 'Butter',  icon: '🧈', price: 30,  color: '#f2d15c' },
    // Region 2: Nordufer & Hinterland
    hops:       { name: 'Hopfen',      icon: '🌿', price: 4,   color: '#8cc63f' },
    beer:       { name: 'Bier',        icon: '🍺', price: 55,  color: '#e9b03b' },
    grapes:     { name: 'Trauben',     icon: '🍇', price: 6,   color: '#7b4f9e' },
    wine:       { name: 'Wein',        icon: '🍷', price: 80,  color: '#9c2f45' },
    apples:     { name: 'Äpfel',       icon: '🍎', price: 3,   color: '#d9452f' },
    cider:      { name: 'Most',        icon: '🧃', price: 36,  color: '#e8b04a' },
    brandy:     { name: 'Apfelbrand',  icon: '🥃', price: 260, color: '#c9862f' },
    fish:       { name: 'Felchen',     icon: '🐟', price: 5,   color: '#9fb8c8' },
    smokedfish: { name: 'Räucherfisch', icon: '🍢', price: 38, color: '#b0703a' },
    // Region 3: Allgäu & Lindau. energy = Energie: lässt sich nicht einlagern, Überschuss geht ins Netz
    power:      { name: 'Strom',       icon: '⚡', price: 6,   color: '#ffd23f', energy: true },
    cheese:     { name: 'Bergkäse',    icon: '🧀', price: 130, color: '#f5c542' },
    shingles:   { name: 'Schindeln',   icon: '🪵', price: 32,  color: '#c08a52' },
    timber:     { name: 'Holzbau',     icon: '🛖', price: 340, color: '#9c6b3e' },
    // Region 4: Vorarlberg
    stone:      { name: 'Stein',          icon: '🏔️', price: 8,   color: '#8d8a86' },
    ashlar:     { name: 'Werkstein',      icon: '🏛️', price: 75,  color: '#c9c2b4' },
    wool:       { name: 'Wolle',          icon: '🧶', price: 9,   color: '#f1ece2' },
    cloth:      { name: 'Stoff',          icon: '🧵', price: 110, color: '#5b7fb8' },

 * 2. UTILS – Format, Mathe, Geometrie

function groupDE(intStr) { return intStr.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function fmt(n) {
  if (!isFinite(n)) return '∞';
  const neg = n < 0; n = Math.abs(n);
  let out;
  if (n < 10000) out = groupDE(String(Math.floor(n)));
  else {
    const units = [[1e12, 'Bio.'], [1e9, 'Mrd.'], [1e6, 'Mio.'], [1e3, 'Tsd.']];
    const [div, label] = units.find(([d]) => n >= d);
    const v = n / div;
    out = (v >= 100 ? Math.floor(v).toString() : (Math.floor(v * 10) / 10).toFixed(1).replace('.', ',')) + ' ' + label;
  }
  return (neg ? '−' : '') + out;
}
function fmtRate(n) { return n < 10 ? (Math.round(n * 10) / 10).toString().replace('.', ',') : fmt(n); }
function fmtSec(s) { return (s < 10 ? (Math.round(s * 10) / 10).toString().replace('.', ',') : Math.round(s)) + ' s'; }
function fmtDuration(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return h + ' h ' + m + ' min';
  if (m) return m + ' min ' + (s % 60) + ' s';
  return s + ' s';
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// Deterministischer Pseudozufall pro Feld (für Deko)
function hashRand(a, b, k = 0) {
  let h = (a * 374761393 + b * 668265263 + k * 2147483647) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const S = CONFIG.grid.side;
const W = S * (1 + Math.SQRT2);        // Achteck-Breite (Kante zu Kante)
const HS = S / 2, HW = W / 2, SQ = S / Math.SQRT2; // Halbmaße
// Achteck-Ecken relativ zum Mittelpunkt, im Uhrzeigersinn ab oben-rechts
const OCT_SHAPE = [[HS, -HW], [HW, -HS], [HW, HS], [HS, HW], [-HS, HW], [-HW, HS], [-HW, -HS], [-HS, -HW]];
const SQ_SHAPE = [[0, -SQ], [SQ, 0], [0, SQ], [-SQ, 0]];

/* =====================================================================
 * 3. STATE
 * ===================================================================== */
let state = null;   // serialisierbar
const world = {     // Laufzeit, aus state + CONFIG abgeleitet
  region: null, octs: [], octMap: new Map(), squares: [], sqMap: new Map(),
  bounds: { minX: 0, minY: 0, maxX: 0, maxY: 0 },
  town: null,
  procs: [], prods: [],      // aktive Verarbeitungsbetriebe / Rohstoffbetriebe
  station: null,             // Feld mit Ballonstation
  hangar: null,              // Feld mit Luftschiffhalle
  ferryMult: 1,              // Preisfaktor durch Fährstationen
  procReserve: {},           // Ware → Menge, die Verarbeiter für ihre nächste Charge brauchen
  reserve: {},               // procReserve + offene Ballon-Ladung (je Tick aktualisiert)
  pathCache: new Map(),
  income: 0,                 // geglättetes Einkommen/s (Anzeige)
};
const fx = { fogClear: new Map(), popups: [], dots: [], levelUp: new Map(), balloons: [], flight: null, fadeIn: 0 };
let selected = null; // { kind:'oct'|'sq', ref }

// Neuer Spielstand. regionIndex/keep: beim Regionswechsel bleiben Seeperlen, Upgrades usw. erhalten
function newState(regionIndex = 0, keep = null) {
  const sell = {};
  for (const g in CONFIG.goods) sell[g] = true;
  const s = {
    saveVersion: CONFIG.saveVersion,
    lastSeen: Date.now(),
    regionIndex,
    coins: 0,
    pearls: CONFIG.start.pearls,
    fields: {},              // "c,r" → { u: 0|1, b: null | { k, l, p, a } }
    inventory: {},
    market: { sell },
    settings: { sound: true, dialect: false },
    camera: null,
    stats: { unlocks: 0, earned: 0, produced: {}, regionDone: false },   // pro Region
    // --- ab M3 ---
    globalUpgrades: {},      // "speed:wood" | "price:wood" | "offline" | "storage" | "startCoins" → Stufe (bleibt)
    goals: { claimed: [] },  // abgeholte Ziel-IDs der Region
    balloon: { fill: {}, launches: 0, load: true, t: 0 },
    airship: { fill: {}, load: true, t: 0 },                              // ab M4, pro Region
    lifetime: { earned: 0, pearls: 0, launches: 0, regions: 0 },          // bleibt
  };
  if (keep) for (const k of ['pearls', 'globalUpgrades', 'settings', 'lifetime']) s[k] = keep[k];
  s.coins = CONFIG.regions[regionIndex].startCoins + metaValue('startCoins', s);
  return s;
}

const key = (c, r) => c + ',' + r;

function buildWorld() {
  const region = CONFIG.regions[state.regionIndex];
  world.region = region;
  world.octs = []; world.octMap.clear(); world.squares = []; world.sqMap.clear();

  region.map.forEach((line, row) => {
    [...line].forEach((ch, col) => {
      const type = TYPE_BY_CHAR[ch];
      if (!type) return;
      const k = key(col, row);
      if (!state.fields[k]) state.fields[k] = { u: region.startUnlocked.includes(ch) ? 1 : 0 };
      if (state.fields[k].b && !CONFIG.buildings[state.fields[k].b.k]) state.fields[k].b = null; // unbekanntes Gebäude
      const cx = col * W, cy = row * W;
      const oct = {
        id: k, col, row, type, cx, cy, startField: region.startUnlocked.includes(ch),
        poly: OCT_SHAPE.map(([x, y]) => [cx + x, cy + y]),
        nOct: [], nSq: [], popCoins: 0, popT: 0,
        get unlocked() { return !!state.fields[k].u; },
        get b() { return state.fields[k].b || null; },
      };
      world.octs.push(oct); world.octMap.set(k, oct);
    });
  });

  // Nachbarn
  for (const o of world.octs) {
    const { col: c, row: r } = o;
    o.nOct = [key(c, r - 1), key(c + 1, r), key(c, r + 1), key(c - 1, r)].map(k => world.octMap.get(k) || null);
  }
  // Quadrate: (c,r) liegt bei (c+0.5, r+0.5)
  const cols = Math.max(...region.map.map(l => l.length));
  for (let r = -1; r < region.map.length; r++) {
    for (let c = -1; c < cols; c++) {
      const n = [key(c, r), key(c + 1, r), key(c + 1, r + 1), key(c, r + 1)].map(k => world.octMap.get(k) || null); // NW,NE,SE,SW
      if (n.filter(Boolean).length < 2) continue;
      const cx = (c + 0.5) * W, cy = (r + 0.5) * W;
      const sq = { id: key(c, r), c, r, cx, cy, nOct: n, poly: SQ_SHAPE.map(([x, y]) => [cx + x, cy + y]) };
      world.squares.push(sq); world.sqMap.set(sq.id, sq);
    }
  }
  for (const o of world.octs) {
    const { col: c, row: r } = o;
    o.nSq = [key(c, r - 1), key(c, r), key(c - 1, r), key(c - 1, r - 1)].map(k => world.sqMap.get(k) || null); // NE,SE,SW,NW
  }

  const xs = world.octs.map(o => o.cx), ys = world.octs.map(o => o.cy);
  world.bounds = { minX: Math.min(...xs) - HW, maxX: Math.max(...xs) + HW, minY: Math.min(...ys) - HW, maxY: Math.max(...ys) + HW };
  world.town = world.octs.find(o => o.type === 'town') || null;

  // Rohstoffbetriebe auf freien Feldern sicherstellen (auch nach Migration)
  for (const o of world.octs) if (o.unlocked) ensureProducer(o);
  for (const g in CONFIG.goods) {
    if (state.market.sell[g] === undefined) state.market.sell[g] = true;
    if (!(state.inventory[g] >= 0)) state.inventory[g] = 0;
  }
  fx.dots = []; fx.popups = []; fx.fogClear.clear(); fx.levelUp.clear(); fx.balloons = [];
  refreshWorld();
  checkRegionComplete(true); // ältere Spielstände: Halle nachträglich aufstellen
}

function ensureProducer(o) {
  const p = CONFIG.fieldTypes[o.type].producer;
  if (p && !state.fields[o.id].b) state.fields[o.id].b = { k: p, l: 1, p: 0 };
}

// Nach jeder Änderung an Feldern/Gebäuden: Listen, Reserven und Wege neu bestimmen
function refreshWorld() {
  world.procs = []; world.prods = []; world.station = null; world.hangar = null; world.ferryMult = 1;
  for (const o of world.octs) {
    if (!o.unlocked || !o.b) continue;
    if (o.b.k === 'balloon') world.station = o;
    if (o.b.k === 'hangar') world.hangar = o;
    if (o.b.k === 'ferry') world.ferryMult += CONFIG.buildings.ferry.bonus[o.b.l - 1];
    const d = def(o.b);
    if (!d.out) continue;
    (d.in ? world.procs : world.prods).push(o);
  }
  world.procReserve = {};
  for (const o of world.procs) {
    const d = def(o.b);
    for (const g in d.in) world.procReserve[g] = (world.procReserve[g] || 0) + d.in[g] * batchSize(o.b);
  }
  updateReserve();
  world.pathCache.clear();
}
// Reserve = Bedarf der Verarbeiter + noch offene Ballon-Ladung (nicht verkaufen!)
function updateReserve() {
  const r = Object.assign({}, world.procReserve);
  if (world.station) addCargoReserve(r, state.balloon, balloonNeed());
  if (airshipLoading()) addCargoReserve(r, state.airship, world.region.airship.need);
  const cap = storageCap();
  for (const g in r) r[g] = Math.min(r[g], cap);
  world.reserve = r;
}
function addCargoReserve(r, c, need) {
  if (!c.load) return;
  for (const g in need) { const w = need[g] - (c.fill[g] || 0); if (w > 0) r[g] = (r[g] || 0) + w; }
}

/* --- Wirtschafts-Helfer --- */
/* --- Globale Upgrades (Meta) --- */
const metaDef = id => { const [a, g] = id.split(':'); return g ? CONFIG.meta[a] : CONFIG.meta.special[id]; };
const gupLevel = (id, s = state) => (s.globalUpgrades && s.globalUpgrades[id]) || 0;
const metaValue = (id, s = state) => metaDef(id).step * gupLevel(id, s);
const gupCost = id => Math.ceil(metaDef(id).base * Math.pow(metaDef(id).growth, gupLevel(id)));
const gupTotal = () => Object.values(state.globalUpgrades).reduce((a, b) => a + b, 0);
const speedMult = g => 1 + metaValue('speed:' + g);
const priceMult = g => 1 + metaValue('price:' + g);
const storageCap = () => CONFIG.storage.cap + metaValue('storage');
const offlineCapHours = () => CONFIG.offline.capHours + metaValue('offline');

/* --- Wirtschafts-Helfer --- */
const def = b => CONFIG.buildings[b.k];
const cycleTime = b => def(b).cycle / (CONFIG.levels.speed[b.l - 1] * (def(b).out ? speedMult(def(b).out) : 1));
const batchSize = b => CONFIG.levels.yield[b.l - 1];
const marketLevel = () => (world.town && world.town.b ? world.town.b.l : 1);
const marketMult = () => 1 + CONFIG.market.bonus[marketLevel() - 1];
const regionMarket = () => world.region.market || { cost: 1, tax: 1 };
const taxRate = () => CONFIG.market.tax[marketLevel() - 1] * regionMarket().tax;
const sellPrice = g => CONFIG.goods[g].price * marketMult() * priceMult(g) * world.ferryMult;
const upgradeCost = b => Math.ceil(def(b).upBase * Math.pow(CONFIG.levels.costGrowth, b.l - 1) * (b.k === 'market' ? regionMarket().cost : 1));
const countKind = k => world.octs.filter(o => o.b && o.b.k === k).length;
const atMax = k => CONFIG.buildings[k].max !== undefined && countKind(k) >= CONFIG.buildings[k].max;   // max = Höchstzahl pro Region
const buildCost = k => (atMax(k) ? Infinity : Math.ceil(CONFIG.buildings[k].build * Math.pow(CONFIG.buildGrowth, countKind(k))));
const isEnergy = g => !!CONFIG.goods[g].energy;   // Energie (Strom): kein Lager, Überschuss geht immer ins Netz
const sellOn = g => isEnergy(g) || !!state.market.sell[g];
const regionProduces = g => world.octs.some(o => o.unlocked && o.b && def(o.b).out === g);
const regionGoods = () => world.region.chains.flat();

// Luftschiffplatz zählt nicht als normales Feld
const isHangarField = o => o.type === 'hangar';
const unlockedCount = () => world.octs.filter(o => o.unlocked && !isHangarField(o)).length;
const fieldCount = () => world.octs.filter(o => !isHangarField(o)).length;
const startCount = () => world.octs.filter(o => o.startField).length;
function unlockCost() {
  const n = Math.max(0, unlockedCount() - startCount()), U = world.region.unlock;
  return Math.ceil(U.base * Math.pow(U.growth, n));
}
const isUnlockable = o => !o.unlocked && !isHangarField(o) && o.nOct.some(n => n && n.unlocked);
const allUnlocked = () => world.octs.every(o => o.unlocked || isHangarField(o));
/* --- Luftschiff --- */
const nextRegion = () => CONFIG.regions[state.regionIndex + 1] || null;
const airshipLoading = () => !!(world.hangar && world.region.airship && nextRegion());

/* --- Ballon --- */
function balloonNeed() {
  const recs = world.region.balloon, n = state.balloon.launches;
  const f = Math.pow(CONFIG.balloon.needGrowth, n), r = recs[n % recs.length], need = {};
  for (const g in r) need[g] = Math.min(storageCap(), Math.ceil(r[g] * f));
  return need;
}
const cargoFull = (c, need) => Object.keys(need).every(g => (c.fill[g] || 0) >= need[g]);
const cargoFrac = (c, need) => { let a = 0, b = 0; for (const g in need) { a += Math.min(need[g], c.fill[g] || 0); b += need[g]; } return b ? a / b : 0; };
function balloonReward() {
  const C = CONFIG.balloon, L = world.station ? world.station.b.l : 1, need = balloonNeed();
  let value = 0;
  for (const g in need) value += need[g] * CONFIG.goods[g].price;
  return {
    coins: Math.ceil(value * C.coinMult * (1 + C.levelCoin * (L - 1))),
    pearls: C.pearls[L - 1] + Math.floor(state.balloon.launches / C.pearlsEvery),
    reveal: C.reveal[L - 1],
  };
}

/* --- Ziele --- */
const goalId = i => world.region.id + ':' + i;
function goalProgress(g) {
  const kindAt = (k, lvl) => world.octs.filter(o => o.unlocked && o.b && o.b.k === k && o.b.l >= lvl).length;
  switch (g.t) {
    case 'unlock': return [unlockedCount() - startCount(), g.n];
    case 'all': return [unlockedCount(), fieldCount()];
    case 'level': return [kindAt(g.k, g.lvl), g.n];
    case 'build': return [kindAt(g.k, 1), g.n];
    case 'produce': return [Math.floor(state.stats.produced[g.g] || 0), g.n];
    case 'earn': return [Math.floor(state.stats.earned), g.n];
    case 'launch': return [state.balloon.launches, g.n];
    case 'gup': return [gupTotal(), g.n];
  }
  return [0, 1];
}
const goalDone = g => { const [a, b] = goalProgress(g); return a >= b; };
// offene Ziele der Region in Reihenfolge: [{ g, i, done }]
function openGoals() {
  return world.region.goals.map((g, i) => ({ g, i, done: goalDone(g) })).filter(x => !state.goals.claimed.includes(goalId(x.i)));
}
function squareKind(sq) {
  const un = sq.nOct.filter(o => o && o.unlocked).length;
  const water = sq.nOct.filter(o => o && CONFIG.fieldTypes[o.type].water).length;
  if (un === 0) return 'fog';
  if (water >= 2) return 'buoy';
  if (un >= 2) return 'road';
  return 'path';
}

/* --- Aktionen --- */
function tryUnlock(o) {
  if (!isUnlockable(o)) return false;
  const cost = unlockCost();
  if (state.coins < cost) return false;
  state.coins -= cost;
  revealField(o, performance.now());
  addPopup(o.cx, o.cy, '−' + fmt(cost), '#c0503f');
  sound.pling(880);
  vibrate(15);
  save();
  return true;
}
// Feld aufdecken (gekauft oder durch Ballon)
function revealField(o, t) {
  state.fields[o.id].u = 1;
  state.stats.unlocks++;
  ensureProducer(o);
  refreshWorld();
  fx.fogClear.set(o.id, t);
  checkRegionComplete();
}
// Alle Felder frei → Luftschiffhalle erscheint (silent: beim Laden ohne Dialog)
function checkRegionComplete(silent) {
  if (!allUnlocked()) return;

function tryLaunchBalloon() {

/* =====================================================================
 * 4. SIMULATION – fester Tick
 * ===================================================================== */
const DT = 1 / CONFIG.tickRate;

// Darf eine Ware angenommen werden? Bei aktivem Verkauf immer, sonst nur mit Lagerplatz.
function canAccept(g, n) { return sellOn(g) || (state.inventory[g] || 0) + n <= storageCap(); }
// Lädt Waren aus dem Lager in eine Ladung (Ballon/Luftschiff), rate = Einheiten/s je Ware
function loadCargo(c, need, rate, dt) {
  if (!c.load || cargoFull(c, need)) { c.t = 0; return; }
  const step = 1 / rate;
  c.t = (c.t || 0) + dt;
  if (c.t < step) return;
  const n = Math.floor(c.t / step);
  c.t -= n * step;
  for (const g in need) {
    const take = Math.min(need[g] - (c.fill[g] || 0), n, Math.floor(state.inventory[g] || 0));
    if (take > 0) { state.inventory[g] -= take; c.fill[g] = (c.fill[g] || 0) + take; }
  }
}
// Verkauft alles über der Reserve (die Betriebe für ihre nächste Charge brauchen)
function sellSurplus(g) {
  if (!sellOn(g)) return 0;
  const n = (state.inventory[g] || 0) - (world.reserve[g] || 0);
  if (n <= 0) return 0;
  state.inventory[g] -= n;
  return n * sellPrice(g);
}
function deliver(o, g, n, silent) {
  state.inventory[g] = (state.inventory[g] || 0) + n;
  state.stats.produced[g] = (state.stats.produced[g] || 0) + n;
  const c = sellSurplus(g);
  if (!silent && c > 0) {
    o.popCoins += c;
    const now = performance.now();
    if (now - o.popT >= CONFIG.popupEveryMs) { addPopup(o.cx, o.cy, '+' + fmt(o.popCoins), '#d39a12'); o.popCoins = 0; o.popT = now; }
  }
  return c;
}
function tryStart(o, b, d, silent) {
  let n = batchSize(b);
  for (const g in d.in) n = Math.min(n, Math.floor((state.inventory[g] || 0) / d.in[g]));
  if (n < 1) return;
  for (const g in d.in) state.inventory[g] -= d.in[g] * n;
  b.a = n; b.p = 0;
  if (!silent) spawnTransport(o, d);
}

// Ein Simulationsschritt. silent = ohne Effekte (Offline-Nachberechnung)
function simTick(dt, silent) {
  updateReserve();
  let earned = taxRate() * dt;
  for (const o of world.procs) {
    const b = o.b, d = def(b);
    if (!b.a) tryStart(o, b, d, silent);
    if (!b.a) continue;
    b.p += dt / cycleTime(b);
    if (b.p >= 1) {
      if (canAccept(d.out, b.a)) {
        const rest = b.p - 1;
        earned += deliver(o, d.out, b.a, silent);
        b.a = 0; b.p = 0;
        tryStart(o, b, d, silent);
        if (b.a) b.p = rest;
      } else b.p = 1; // Lager voll
    }
  }
  for (const o of world.prods) {
    const b = o.b, d = def(b), n = batchSize(b);
    b.p += dt / cycleTime(b);
    while (b.p >= 1) {
      if (!canAccept(d.out, n)) { b.p = 1; break; }
      earned += deliver(o, d.out, n, silent);
      b.p -= 1;
    }
  }
  if (world.station) loadCargo(state.balloon, balloonNeed(), CONFIG.balloon.rate[world.station.b.l - 1], dt);
  if (airshipLoading()) loadCargo(state.airship, world.region.airship.need, CONFIG.airship.rate, dt);
  for (const g in CONFIG.goods) earned += sellSurplus(g); // z. B. nach Umschalten auf "Verkaufen"
  state.coins += earned;
  state.stats.earned += earned;
  state.lifetime.earned += earned;
  return earned;
}

// Abwesenheit nachrechnen (begrenzt auf offline.capHours)
function catchUp(seconds) {
  const cap = offlineCapHours() * 3600;
  const sec = clamp(seconds, 0, cap);
  const coins0 = state.coins, prod0 = { ...state.stats.produced };
  const step = Math.max(CONFIG.offline.stepSeconds, sec / CONFIG.offline.maxSteps);
  let left = sec;
  while (left > 1e-6) { const d = Math.min(step, left); simTick(d, true); left -= d; }
  const goods = {};
  for (const g in state.stats.produced) {
    const n = state.stats.produced[g] - (prod0[g] || 0);
    if (n > 0) goods[g] = n;
  }
  state.lastSeen = Date.now();
  return { seconds: sec, away: seconds, capped: seconds > cap, coins: state.coins - coins0, goods };
}

/* --- Transportpunkte entlang der Quadrat-Wege --- */
const nodeId = n => (n.col !== undefined ? 'o' : 's') + n.id;
function findSourcePath(o, g) {
  const ck = o.id + '|' + g;
  if (world.pathCache.has(ck)) return world.pathCache.get(ck);
  const prev = new Map([[nodeId(o), null]]);
  const q = [o];
  let found = null;
  for (let i = 0; i < q.length; i++) {
    const n = q[i], isOct = n.col !== undefined;
    if (isOct && n !== o && n.b && def(n.b).out === g) { found = n; break; }
    const nb = isOct ? n.nSq.filter(s => s && squareKind(s) !== 'fog') : n.nOct.filter(x => x && x.unlocked);
    for (const m of nb) { const id = nodeId(m); if (!prev.has(id)) { prev.set(id, n); q.push(m); } }
  }
  let path = null;
  if (found) {
    const pts = [];
    for (let n = found; n; n = prev.get(nodeId(n))) {
      const isOct = n.col !== undefined, wet = isOct ? !!CONFIG.fieldTypes[n.type].water : squareKind(n) === 'buoy';
      pts.push([n.cx, n.cy, isOct ? 0 : 1, wet ? 1 : 0]);
    }
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    path = { pts, cum, len: cum[cum.length - 1] };
  }
  world.pathCache.set(ck, path);
  return path;
}
function spawnTransport(o, d) {
  const C = CONFIG.transport;
  for (const g in d.in) {
    if (fx.dots.length >= C.maxDots) return;
    const path = findSourcePath(o, g);
    if (!path || path.len <= 0) continue;
    const spark = isEnergy(g);
    fx.dots.push({ path, spark, t0: performance.now(), dur: clamp(path.len / C.speed, C.minSeconds, C.maxSeconds) * 1000 * (spark ? 0.5 : 1), color: CONFIG.goods[g].color });
  }
}

/* =====================================================================
 * 5. RENDERING
 * ===================================================================== */
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
let dpr = 1, vw = 0, vh = 0, fitZoom = 1;
const cam = { x: 0, y: 0, zoom: 1, vx: 0, vy: 0, focus: null };
const T = CONFIG.grid.tilt;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  const b = world.bounds;
  fitZoom = Math.min(vw / (b.maxX - b.minX + W), (vh - 140) / ((b.maxY - b.minY) * T + W));
  clampCamera();
}
// Welt -> Bildschirm
const sx = wx => (wx - cam.x) * cam.zoom + vw / 2;
const sy = wy => (wy * T - cam.y) * cam.zoom + vh / 2;
// Bildschirm -> Welt
const wxOf = px => (px - vw / 2) / cam.zoom + cam.x;
const wyOf = py => ((py - vh / 2) / cam.zoom + cam.y) / T;

function clampCamera() {
  const b = world.bounds;
  cam.zoom = clamp(cam.zoom, fitZoom * CONFIG.camera.minZoom, fitZoom * CONFIG.camera.maxZoom);
  cam.x = clamp(cam.x, b.minX, b.maxX);
  // bei offenem Bottom-Sheet darf die Karte weiter nach oben geschoben werden
  const extra = typeof sheet !== 'undefined' && sheet.classList.contains('open') ? vh * 0.4 / cam.zoom : 0;
  cam.y = clamp(cam.y, b.minY * T, b.maxY * T + extra);
}

function polyPath(poly, dy = 0) {
  ctx.beginPath();
  ctx.moveTo(sx(poly[0][0]), sy(poly[0][1]) + dy);
  for (let i = 1; i < poly.length; i++) ctx.lineTo(sx(poly[i][0]), sy(poly[i][1]) + dy);
  ctx.closePath();
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f >= 0) { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  else { r *= 1 + f; g *= 1 + f; b *= 1 + f; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

function drawBackground(now) {
  const [c1, c2] = world.region.bg;
  const g = ctx.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  // Alpenpanorama hinter der Karte (Weltraum, leichte Parallaxe)
  const b = world.bounds;
  const baseY = sy(b.minY) - 30 * cam.zoom;
  const par = 0.5;
  ctx.save();
  ctx.translate((vw / 2 - sx((b.minX + b.maxX) / 2)) * par, 0);
  const left = sx(b.minX - W * 3), right = sx(b.maxX + W * 3), span = right - left;
  // Bergpanorama je Region (mountains.hts: Höhen an festen Stützstellen)
  const MT = world.region.mountains || {};
  ctx.fillStyle = MT.color || '#c9dbe8';
  ctx.beginPath(); ctx.moveTo(left, baseY);
  const peaks = [0, .08, .15, .22, .3, .36, .45, .52, .6, .68, .74, .82, .9, 1];
  const hts = MT.hts || [0, 60, 30, 95, 50, 120, 70, 140, 80, 100, 55, 110, 40, 0];
  peaks.forEach((p, i) => ctx.lineTo(left + span * p, baseY - hts[i] * cam.zoom * 0.7));
  ctx.closePath(); ctx.fill();
  // weicher Dunst am Bergfuß statt harter Kante
  const haze = ctx.createLinearGradient(0, baseY - 40 * cam.zoom, 0, baseY + 30 * cam.zoom);
  haze.addColorStop(0, 'rgba(223,240,228,0)'); haze.addColorStop(1, c2);
  ctx.fillStyle = haze; ctx.fillRect(left - vw, baseY - 40 * cam.zoom, span + vw * 2, 70 * cam.zoom);
  ctx.fillStyle = c2; ctx.fillRect(left - vw, baseY + 30 * cam.zoom - 1, span + vw * 2, vh * 2);
  // Schneekappen
  ctx.fillStyle = '#f4f8fb';
  peaks.forEach((p, i) => {
    if (hts[i] < 90) return;
    const x = left + span * p, y = baseY - hts[i] * cam.zoom * 0.7, w = 16 * cam.zoom, h = 14 * cam.zoom;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w * .3, y + h * .7); ctx.lineTo(x, y + h * 1.1);
    ctx.lineTo(x - w * .4, y + h * .7); ctx.lineTo(x - w, y + h); ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

function drawSquare(sq, now) {
  const kind = squareKind(sq);
  const col = kind === 'fog' ? CONFIG.square.fog : kind === 'buoy' ? '#8fcbe8' : kind === 'road' ? CONFIG.square.road : CONFIG.square.path;
  polyPath(sq.poly, CONFIG.grid.depth * cam.zoom * 0.6);
  ctx.fillStyle = col; ctx.fill();
  if (kind === 'road' || kind === 'path') {
    // Pflaster-/Wegmuster: kleine Kreuzung
    const x = sx(sq.cx), y = sy(sq.cy) + CONFIG.grid.depth * cam.zoom * 0.6, r = SQ * cam.zoom * 0.45;
    ctx.strokeStyle = shade(col, kind === 'road' ? -0.18 : -0.1); ctx.lineWidth = Math.max(1, 1.4 * cam.zoom);
    ctx.setLineDash([3 * cam.zoom, 3 * cam.zoom]);
    ctx.beginPath(); ctx.moveTo(x - r, y); ctx.lineTo(x + r, y); ctx.moveTo(x, y - r * T); ctx.lineTo(x, y + r * T); ctx.stroke();
    ctx.setLineDash([]);
  } else if (kind === 'buoy') {
    const x = sx(sq.cx), y = sy(sq.cy) + CONFIG.grid.depth * cam.zoom * 0.6;
    const bob = Math.sin(now / 500 + sq.c) * 1.5 * cam.zoom;
    ctx.fillStyle = '#e8573f'; ctx.beginPath(); ctx.arc(x, y + bob, 3.5 * cam.zoom, 0, Math.PI * 2); ctx.fill();
  }
}

function drawOct(o, now) {
  const z = cam.zoom, d = CONFIG.grid.depth * z;
  const ft = CONFIG.fieldTypes[o.type];
  const clearT = fx.fogClear.get(o.id);
  let fogA = o.unlocked ? 0 : 1;
  if (clearT !== undefined) {
    const t = Math.max(0, (now - clearT) / CONFIG.fogClearMs); // Startzeit kann in der Zukunft liegen (verzögertes Aufdecken)
    if (t >= 1) fx.fogClear.delete(o.id); else fogA = 1 - easeOut(t);
  }
  const p = o.poly;
  // Extrusion entlang der unteren Kanten: p[2]..p[5]
  const sideCol = o.unlocked ? ft.side : CONFIG.fog.side;
  ctx.beginPath();
  ctx.moveTo(sx(p[2][0]), sy(p[2][1]));
  for (let i = 3; i <= 5; i++) ctx.lineTo(sx(p[i][0]), sy(p[i][1]));
  for (let i = 5; i >= 2; i--) ctx.lineTo(sx(p[i][0]), sy(p[i][1]) + d);
  ctx.closePath(); ctx.fillStyle = sideCol; ctx.fill();

  // Oberseite
  if (o.unlocked) {
    polyPath(p); ctx.fillStyle = ft.top; ctx.fill();
    ctx.strokeStyle = shade(ft.top, 0.35); ctx.lineWidth = Math.max(1, 1.2 * z); ctx.stroke();
    drawDecor(o, now);
    if (o.b) drawBuildingOverlay(o, now);
    const lu = fx.levelUp.get(o.id);
    if (lu !== undefined) {
      const t = Math.max(0, (now - lu) / 700);
      if (t >= 1) fx.levelUp.delete(o.id);
      else {
        ctx.save(); ctx.globalAlpha = 1 - t;
        ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 3 * z;
        ctx.beginPath(); ctx.ellipse(sx(o.cx), sy(o.cy), HW * z * (0.4 + t * 0.7), HW * z * T * (0.4 + t * 0.7), 0, 0, Math.PI * 2); ctx.stroke();
        ctx.restore();
      }
    }
    if (selected && selected.ref === o) {
      polyPath(p); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3 * z; ctx.stroke();
      polyPath(p); ctx.strokeStyle = 'rgba(47,127,181,.9)'; ctx.lineWidth = 1.5 * z; ctx.stroke();
    }
  }
  if (fogA > 0) drawFog(o, now, fogA);
}

function drawFog(o, now, a) {
  const z = cam.zoom, p = o.poly;
  const spread = 1 + (1 - a) * 0.8; // Nebel zieht beim Freischalten auseinander
  ctx.save();
  ctx.globalAlpha = a;
  // Nebel-Platte nur solange gesperrt; beim Freischalten bleiben nur die wegziehenden Bausche
  if (!o.unlocked) { polyPath(p); ctx.fillStyle = CONFIG.fog.top; ctx.fill(); ctx.strokeStyle = CONFIG.fog.edge; ctx.lineWidth = Math.max(1, z); ctx.stroke(); }
  // Wolkenbausche
  const n = 5;
  ctx.fillStyle = CONFIG.fog.puff;
  for (let i = 0; i < n; i++) {
    const ang = hashRand(o.col, o.row, i) * Math.PI * 2;
    const rad = (0.15 + hashRand(o.col, o.row, i + 9) * 0.25) * W * spread;
    const drift = Math.sin(now / 2400 + i + o.col) * 3;
    const x = sx(o.cx + Math.cos(ang) * rad + drift), y = sy(o.cy + Math.sin(ang) * rad) - 4 * z;
    const r = (0.17 + hashRand(o.col, o.row, i + 3) * 0.1) * W * z;
    ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.75, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  if (!o.unlocked && isHangarField(o) && z > 0.35) {
    const x = sx(o.cx), y = sy(o.cy) - 4 * z, fs = Math.max(9, 10 * z);
    ctx.font = `700 ${fs}px -apple-system, system-ui, sans-serif`;
    const label = 'Luftschiffhalle', w = ctx.measureText(label).width + fs * 1.4, h = fs * 1.7;
    ctx.fillStyle = 'rgba(255,255,255,.85)'; roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();
    ctx.fillStyle = '#6b7f90'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(label, x, y + 0.5);
  }
  if (!o.unlocked && isUnlockable(o) && z > 0.35) {
    // Kosten-Plakette
    const cost = unlockCost();
    const afford = state.coins >= cost;
    const x = sx(o.cx), y = sy(o.cy) - 4 * z;
    const pulse = afford ? 1 + Math.sin(now / 300) * 0.05 : 1;
    const fs = Math.max(9, 11 * z) * pulse;
    ctx.font = `700 ${fs}px -apple-system, system-ui, sans-serif`;
    const label = fmt(cost);
    const tw = ctx.measureText(label).width;
    const h = fs * 1.7, w = tw + h + fs * 0.4;
    ctx.fillStyle = afford ? 'rgba(108,191,74,.95)' : 'rgba(255,255,255,.92)';
    roundRect(x - w / 2, y - h / 2, w, h, h / 2); ctx.fill();

  ctx.fillStyle = roof;

function drawDecor(o, now) {

// Wahrzeichen der Regionshauptstadt (generische, eigene Formen)

// Verarbeitungsbetriebe: Grundform je Art, wächst sichtbar mit der Stufe
function drawFactory(o, x0, y0, z, now) {
  const b = o.b, d = def(b), L = b.l, run = isRunning(b);
  const s = z * (0.8 + L * 0.06);
  if (L >= 3 && b.k !== 'balloon') house(x0 - 16 * z, y0 + 2 * z, 14 * s, 9 * s, shade(d.wall, -0.05), shade(d.roof, 0.15)); // Anbau
  const bx = x0 + 2 * z, by = y0 + 12 * z;

    case 'balloon': {
      // Startplatz mit angebundenem Ballon, der sich mit der Ladung füllt
      ctx.fillStyle = '#e7dcc4'; ctx.beginPath(); ctx.ellipse(x0 + 6 * z, y0 + 8 * z, 16 * z, 16 * z * T, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#c8b892'; ctx.lineWidth = z; ctx.stroke();
      house(x0 - 16 * z, y0 + 12 * z, 14 * s, 9 * s, d.wall, d.roof);
      const need = balloonNeed(), frac = cargoFrac(state.balloon, need), full = frac >= 1;
      const bob = Math.sin(now / 700 + o.col) * (full ? 2 : 0.6) * z;
      const flying = fx.balloons.some(f => now - f.t0 < f.dur * 0.15);
      if (!flying) drawBalloonShape(x0 + 6 * z, y0 + 10 * z + bob, 22 * s, 0.25 + 0.75 * frac);

      ctx.fillStyle = '#a0703f'; for (let i = 0; i < Math.min(4, 1 + Math.floor(L / 2)); i++) { roundRect(x0 + (18 + (i % 2) * 6) * z, y0 + (12 - Math.floor(i / 2) * 5) * z, 5 * z, 4 * z, z); ctx.fill(); }
      if (L >= 6) flag(x0 - 22 * z, y0 - 2 * z, z, now, '#f2b631');
      return;
    }
    case 'sawmill': {
      // Stammstapel + Sägeblatt
      ctx.fillStyle = '#a0703f'; roundRect(x0 + 12 * z, y0 + 10 * z, 18 * z, 7 * z, 3 * z); ctx.fill();
      ctx.fillStyle = '#e0b07a'; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x0 + (15 + i * 6) * z, y0 + 13.5 * z, 2.2 * z, 0, 7); ctx.fill(); }
      house(bx, by, 24 * s, 14 * s, d.wall, d.roof);
      const sx0 = bx - 4 * s, sy0 = by - 7 * s, rr = 4.5 * s, rot = run ? now / 120 : 0;
      ctx.fillStyle = '#c9d2da'; ctx.beginPath();
      for (let i = 0; i < 16; i++) { const a = rot + i * Math.PI / 8, r = i % 2 ? rr : rr * 0.8; ctx.lineTo(sx0 + Math.cos(a) * r, sy0 + Math.sin(a) * r); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6b7f90'; ctx.beginPath(); ctx.arc(sx0, sy0, 1.3 * s, 0, 7); ctx.fill();
      break;
    }
    case 'joinery': {
      house(bx, by, 26 * s, 15 * s, d.wall, d.roof);
      // Schaufenster mit Stuhl
      ctx.fillStyle = '#bfe3f2'; ctx.fillRect(bx - 9 * s, by - 11 * s, 9 * s, 8 * s);
      ctx.strokeStyle = '#8a4f2a'; ctx.lineWidth = 1.4 * s;
      ctx.beginPath(); ctx.moveTo(bx - 6.5 * s, by - 10 * s); ctx.lineTo(bx - 6.5 * s, by - 4 * s); ctx.moveTo(bx - 6.5 * s, by - 6.5 * s); ctx.lineTo(bx - 2.5 * s, by - 6.5 * s); ctx.lineTo(bx - 2.5 * s, by - 4 * s); ctx.stroke();
      ctx.fillStyle = '#e0aa62'; ctx.fillRect(x0 - 26 * z, y0 + 12 * z, 14 * z, 3 * z); ctx.fillRect(x0 - 25 * z, y0 + 9 * z, 14 * z, 3 * z);
      break;
    }
    case 'concrete': {
      // Silo + Halle + Mischtrommel
      const tx = x0 + 18 * z, tw = 9 * s, th = 22 * s;
      ctx.fillStyle = '#b8c0c7'; ctx.fillRect(tx - tw / 2, y0 + 8 * z - th, tw, th);
      ctx.fillStyle = '#9aa4ad'; ctx.fillRect(tx, y0 + 8 * z - th, tw / 2, th);
      ctx.fillStyle = '#d5dade'; ctx.beginPath(); ctx.ellipse(tx, y0 + 8 * z - th, tw / 2, tw / 4, 0, 0, 7); ctx.fill();
      house(bx - 4 * z, by, 22 * s, 12 * s, d.wall, d.roof);
      const mx = x0 - 8 * z, my = y0 + 16 * z, a = run ? now / 400 : 0;
      ctx.fillStyle = '#e8735a'; ctx.beginPath(); ctx.ellipse(mx, my, 6 * z, 4 * z, 0.3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = z; ctx.beginPath(); ctx.ellipse(mx, my, 6 * z, 4 * z, 0.3, a, a + 1.2); ctx.stroke();
      break;
    }
    case 'creamery': {
      house(bx, by, 24 * s, 14 * s, d.wall, d.roof);
      ctx.fillStyle = '#f2d15c'; ctx.fillRect(bx - 7 * s, by - 10 * s, 7 * s, 5 * s);
      // Milchkannen
      for (let i = 0; i < 2 + (L >= 4 ? 1 : 0); i++) {
        const kx = x0 + (16 + i * 6) * z, ky = y0 + 16 * z;
        ctx.fillStyle = '#dfe6ec'; roundRect(kx - 2.5 * z, ky - 7 * z, 5 * z, 7 * z, 1.5 * z); ctx.fill();
        ctx.fillStyle = '#aab6c0'; ctx.fillRect(kx - 1.5 * z, ky - 9 * z, 3 * z, 2 * z);
      }
      break;
    }
    default: {
      // Halle mit Fässern/Kisten in der Akzentfarbe
      house(bx, by, 24 * s, 14 * s, d.wall, d.roof);
      ctx.fillStyle = shade(d.accent || '#a0703f', 0.4); ctx.fillRect(bx - 8 * s, by - 10 * s, 7 * s, 5 * s);
      for (let i = 0; i < 2 + (L >= 4 ? 1 : 0) + (L >= 6 ? 1 : 0); i++) {
        const kx = x0 + (15 + (i % 2) * 7) * z, ky = y0 + (17 - Math.floor(i / 2) * 6) * z;
        ctx.fillStyle = d.accent || '#a0703f'; ctx.beginPath(); ctx.ellipse(kx, ky - 3 * z, 3 * z, 3.6 * z, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 0.7 * z; ctx.beginPath(); ctx.moveTo(kx - 3 * z, ky - 3 * z); ctx.lineTo(kx + 3 * z, ky - 3 * z); ctx.stroke();
      }
      if (d.smoky && run && L < 4) smoke(bx + 4 * s, by - 18 * s, z, now);
      break;
    }
  }
  if (L >= 4) { // Schornstein
    const cx = bx + 8 * s, cy = by - 20 * s;
    ctx.fillStyle = '#9c5b44'; ctx.fillRect(cx - 2 * z, cy - 6 * s, 4 * z, 8 * s);
    if (run) smoke(cx, cy - 7 * s, z, now);
  }
  if (L >= 6) flag(bx - 10 * s, by - 18 * s, z, now, '#f2b631');
}

// Fortschrittsring, Stufen-Punkte und Statushinweis
function drawBuildingOverlay(o, now) {
  const z = cam.zoom; if (z < 0.45) return;
  const b = o.b, d = def(b), x0 = sx(o.cx), y0 = sy(o.cy);
  // Stufen-Punkte am unteren Rand
  const py = y0 + 28 * z * T + 4 * z;
  if (!d.noUpgrade) for (let i = 0; i < CONFIG.levels.max; i++) {
    ctx.fillStyle = i < b.l ? '#f2b631' : 'rgba(255,255,255,.75)';
    ctx.beginPath(); ctx.arc(x0 + (i - 2.5) * 6 * z, py, 2.1 * z, 0, 7); ctx.fill();
  }
  const rx = x0 + 30 * z, ry = y0 + 6 * z, r = 6 * z;
  if (b.k === 'balloon' || (b.k === 'hangar' && airshipLoading())) {
    const frac = b.k === 'balloon' ? cargoFrac(state.balloon, balloonNeed()) : cargoFrac(state.airship, world.region.airship.need);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(rx, ry, r + 1.5 * z, 0, 7); ctx.fill();
    if (frac >= 1) {
      const pulse = 1 + Math.sin(now / 200) * 0.12;
      ctx.fillStyle = '#e8735a'; ctx.beginPath(); ctx.arc(rx, ry, r * pulse, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `800 ${9 * z}px -apple-system, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('!', rx, ry + 0.5 * z);
    } else {
      ctx.strokeStyle = '#e3e9ee'; ctx.lineWidth = 2.4 * z; ctx.beginPath(); ctx.arc(rx, ry, r - z, 0, 7); ctx.stroke();
      ctx.strokeStyle = '#e8735a'; ctx.beginPath(); ctx.arc(rx, ry, r - z, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
    }
    return;
  }
  if (!d.out) return;
  const stalled = b.p >= 1 && !canAccept(d.out, d.in ? b.a : batchSize(b));
  const waiting = d.in && !b.a;
  ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(rx, ry, r + 1.5 * z, 0, 7); ctx.fill();
  if (waiting || stalled) {
    ctx.fillStyle = stalled ? '#c0503f' : '#e09a2b';
    ctx.font = `800 ${9 * z}px -apple-system, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(stalled ? '■' : '…', rx, ry + 0.5 * z);
    return;
  }
  ctx.strokeStyle = '#e3e9ee'; ctx.lineWidth = 2.4 * z; ctx.beginPath(); ctx.arc(rx, ry, r - z, 0, 7); ctx.stroke();
  ctx.strokeStyle = d.in ? '#6f4a8e' : '#6cbf4a';
  ctx.beginPath(); ctx.arc(rx, ry, r - z, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(b.p, 0, 1)); ctx.stroke();
}

function drawDots(now) {
  const z = cam.zoom, off = CONFIG.grid.depth * z * 0.6;
  fx.dots = fx.dots.filter(d => now - d.t0 < d.dur);
  for (const d of fx.dots) {
    const { pts, cum, len } = d.path;
    const dist = easeOut(clamp((now - d.t0) / d.dur, 0, 1)) * len;
    let i = 1; while (i < cum.length - 1 && cum[i] < dist) i++;
    const seg = cum[i] - cum[i - 1] || 1, t = clamp((dist - cum[i - 1]) / seg, 0, 1);
    const a = pts[i - 1], b = pts[i];
    const x = sx(lerp(a[0], b[0], t)), y = sy(lerp(a[1], b[1], t)) + lerp(a[2], b[2], t) * off - 3 * z;
    if (d.spark) { // Strom: leuchtender Funke statt Karren
      const fl = 1 + Math.sin(now / 40 + d.t0) * 0.25;
      ctx.fillStyle = 'rgba(255,220,80,.35)'; ctx.beginPath(); ctx.arc(x, y - 3 * z, 6 * z * fl, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(x, y - 3 * z, 2.6 * z, 0, 7); ctx.fill();
      continue;
    }
    if (a[3] && b[3]) { // Boot auf dem Wasser
      const dir = b[0] >= a[0] ? 1 : -1;
      ctx.fillStyle = '#8a5a33'; ctx.beginPath(); ctx.moveTo(x - 6 * z, y); ctx.lineTo(x + 6 * z, y); ctx.lineTo(x + 4 * z, y + 3 * z); ctx.lineTo(x - 4 * z, y + 3 * z); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - dir * z, y - 10 * z); ctx.lineTo(x + dir * 5 * z, y - 1 * z); ctx.lineTo(x - dir * z, y - 1 * z); ctx.closePath(); ctx.fill();
      ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(x - dir * 3.5 * z, y - 1.5 * z, 2.4 * z, 0, 7); ctx.fill();
      continue;
    }
    // kleiner Karren
    ctx.fillStyle = '#4b3a2a'; roundRect(x - 5 * z, y - 2 * z, 10 * z, 5 * z, 1.5 * z); ctx.fill();
    ctx.fillStyle = d.color; ctx.beginPath(); ctx.arc(x, y - 2.5 * z, 3.4 * z, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 0.8 * z; ctx.stroke();
  }
}

// Ballonflüge: steigt von der Station auf, zieht über die Nebelziele und verschwindet nach oben
function drawFlights(now) {
  const z = cam.zoom;
  fx.balloons = fx.balloons.filter(f => now - f.t0 < f.dur);
  for (const f of fx.balloons) {
    const t = clamp((now - f.t0) / f.dur, 0, 0.999); // rAF-Zeit kann knapp vor t0 liegen
    const pts = [[f.x, f.y], ...f.targets.map(o => [o.cx, o.cy])];
    const last = pts[pts.length - 1];
    pts.push([last[0] + W * 1.5, last[1] - W * 3]);
    const seg = t * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(seg)), u = easeOut(seg - i) * 0.5 + (seg - i) * 0.5;
    const wx = lerp(pts[i][0], pts[i + 1][0], u), wy = lerp(pts[i][1], pts[i + 1][1], u);
    const lift = (18 + Math.min(1, t * 4) * 50 + t * 40) * z;
    const x = sx(wx), y = sy(wy) - lift + Math.sin(now / 500) * 2 * z;
    ctx.save(); ctx.globalAlpha = t > 0.85 ? (1 - t) / 0.15 : 1;
    ctx.fillStyle = 'rgba(30,50,70,.15)'; ctx.beginPath(); ctx.ellipse(sx(wx), sy(wy), 10 * z, 4 * z, 0, 0, 7); ctx.fill();
    drawBalloonShape(x, y, 30 * z, 1);
    ctx.restore();
  }
}

// Abflug des Luftschiffs: steigt aus der Halle, fliegt über den See davon, Blende ins Weiße
function drawAirshipFlight(now) {
  const f = fx.flight;
  if (f) {
    const t = clamp((now - f.t0) / f.dur, 0, 1), z = cam.zoom;
    const x0 = sx(f.x), y0 = sy(f.y) - 22 * z;
    const rise = easeOut(Math.min(1, t * 2.5));
    const x = x0 + Math.pow(t, 2) * vw * 1.1, y = y0 - rise * 50 * z - t * vh * 0.35;
    const sc = 50 * z * (1 + t * 1.6);
    ctx.fillStyle = 'rgba(30,50,70,' + (0.18 * (1 - t)) + ')'; ctx.beginPath(); ctx.ellipse(x, sy(f.y) + 10 * z, sc * 0.4, sc * 0.08, 0, 0, 7); ctx.fill();
    drawAirshipShape(x, y, sc, now);
    if (t > 0.65) { ctx.fillStyle = 'rgba(255,255,255,' + ((t - 0.65) / 0.35) + ')'; ctx.fillRect(0, 0, vw, vh); }
  }
  if (fx.fadeIn) {
    const t = (now - fx.fadeIn) / CONFIG.airship.fadeMs;
    if (t >= 1) fx.fadeIn = 0;
    else { ctx.fillStyle = 'rgba(255,255,255,' + (1 - easeOut(Math.max(0, t))) + ')'; ctx.fillRect(0, 0, vw, vh); }
  }
}

function addPopup(wx, wy, text, color) { fx.popups.push({ wx, wy, text, color, t0: performance.now() }); }
function drawPopups(now) {
  fx.popups = fx.popups.filter(p => now - p.t0 < 1200);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of fx.popups) {
    const t = (now - p.t0) / 1200;
    ctx.globalAlpha = 1 - t * t;
    ctx.font = `800 ${Math.max(13, 15 * cam.zoom)}px -apple-system, system-ui, sans-serif`;
    const x = sx(p.wx), y = sy(p.wy) - 20 * cam.zoom - t * 40;
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, x, y);
    ctx.fillStyle = p.color; ctx.fillText(p.text, x, y);
  }
  ctx.globalAlpha = 1;
}

function render(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackground(now);
  for (const sq of world.squares) drawSquare(sq, now);
  // Achtecke zeilenweise (Painter's Algorithm); world.octs ist bereits nach Zeile sortiert
  for (const o of world.octs) drawOct(o, now);
  drawDots(now);
  drawFlights(now);
  drawPopups(now);
  drawAirshipFlight(now);
}

/* =====================================================================
 * 6. INPUT – Pan, Pinch, Tap, Mausrad
 * ===================================================================== */
const pointers = new Map();
let gesture = null; // { mode:'tap'|'pan'|'pinch', ... }
let lastMove = { t: 0, x: 0, y: 0 };

function pinchInfo() {
  const [a, b] = [...pointers.values()];
  return { mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, dist: Math.hypot(a.x - b.x, a.y - b.y) || 1 };
}
canvas.addEventListener('pointerdown', e => {
  cam.focus = null;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* synthetische Events */ }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cam.vx = cam.vy = 0;
  if (pointers.size === 1) {
    gesture = { mode: 'tap', sx: e.clientX, sy: e.clientY, cx: cam.x, cy: cam.y };
    lastMove = { t: performance.now(), x: e.clientX, y: e.clientY };
  } else if (pointers.size === 2) {
    const p = pinchInfo();
    gesture = { mode: 'pinch', ...p, zoom: cam.zoom, wx: wxOf(p.mx), wyp: (p.my - vh / 2) / cam.zoom + cam.y };
  }
});
canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!gesture) return;
  if (gesture.mode === 'tap' && Math.hypot(e.clientX - gesture.sx, e.clientY - gesture.sy) > CONFIG.camera.tapSlop) gesture.mode = 'pan';
  if (gesture.mode === 'pan') {
    cam.x = gesture.cx - (e.clientX - gesture.sx) / cam.zoom;
    cam.y = gesture.cy - (e.clientY - gesture.sy) / cam.zoom;
    const now = performance.now(), dt = Math.max(1, now - lastMove.t);
    cam.vx = -(e.clientX - lastMove.x) / dt * 16 / cam.zoom;
    cam.vy = -(e.clientY - lastMove.y) / dt * 16 / cam.zoom;
    lastMove = { t: now, x: e.clientX, y: e.clientY };
    clampCamera();
  } else if (gesture.mode === 'pinch' && pointers.size >= 2) {
    const p = pinchInfo();
    cam.zoom = clamp(gesture.zoom * p.dist / gesture.dist, fitZoom * CONFIG.camera.minZoom, fitZoom * CONFIG.camera.maxZoom);
    // gegriffener Weltpunkt bleibt unter dem Fingermittelpunkt
    cam.x = gesture.wx - (p.mx - vw / 2) / cam.zoom;
    cam.y = gesture.wyp - (p.my - vh / 2) / cam.zoom;
    clampCamera();
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.mode === 'tap' && pointers.size === 0 && e.type === 'pointerup') handleTap(e.clientX, e.clientY);
  if (gesture && gesture.mode === 'pan' && performance.now() - lastMove.t > 80) cam.vx = cam.vy = 0;
  if (pointers.size === 1 && gesture && gesture.mode === 'pinch') {
    // weiter mit Ein-Finger-Pan, ohne Sprung
    const [p] = [...pointers.values()];
    gesture = { mode: 'pan', sx: p.x, sy: p.y, cx: cam.x, cy: cam.y };
    lastMove = { t: performance.now(), x: p.x, y: p.y };
    cam.vx = cam.vy = 0;
  } else if (pointers.size === 0) gesture = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const wx = wxOf(e.clientX), wyp = (e.clientY - vh / 2) / cam.zoom + cam.y;
  cam.zoom = clamp(cam.zoom * Math.exp(-e.deltaY * 0.0015), fitZoom * CONFIG.camera.minZoom, fitZoom * CONFIG.camera.maxZoom);
  cam.x = wx - (e.clientX - vw / 2) / cam.zoom;
  cam.y = wyp - (e.clientY - vh / 2) / cam.zoom;
  clampCamera();
}, { passive: false });
// iOS Safari: System-Zoom unterdrücken
['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

function hitTest(px, py) {
  const wx = wxOf(px), wy = wyOf(py);
  const o = world.octMap.get(key(Math.round(wx / W), Math.round(wy / W)));
  if (o && pointInPoly(wx, wy, o.poly)) return { kind: 'oct', ref: o };
  // Quadrate liegen optisch etwas tiefer (siehe drawSquare)
  const wy2 = wyOf(py - CONFIG.grid.depth * cam.zoom * 0.6);
  const sq = world.sqMap.get(key(Math.floor(wx / W), Math.floor(wy2 / W)));
  if (sq && pointInPoly(wx, wy2, sq.poly)) return { kind: 'sq', ref: sq };
  return null;
}
function handleTap(px, py) {
  sound.unlock();
  const hit = hitTest(px, py);
  if (!hit) { closeSheet(); return; }
  selected = hit;
  if (hit.kind === 'oct') openOctSheet(hit.ref); else openSquareSheet(hit.ref);
  focusAboveSheet(hit.ref);
}
// Feld sanft über das Bottom-Sheet schieben, falls es verdeckt wäre
function focusAboveSheet(ref) {
  const top = vh - sheetInner.offsetHeight, y = sy(ref.cy);
  if (y < top - 50 * cam.zoom) return;
  const want = Math.max(110, top * 0.55);
  cam.focus = { t0: performance.now(), from: cam.y, to: cam.y + (y - want) / cam.zoom };
}

const $ = id => document.getElementById(id);

let sheetRefresh = null, modalRefresh = null;
const COIN_SVG = '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f2b631"/><circle cx="12" cy="12" r="7" fill="#f7cd5c"/></svg>';
const PEARL_SVG = '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#cbbcf0"/><circle cx="9" cy="9" r="3" fill="#fff" opacity=".8"/></svg>';
const T_OK = () => state.settings.dialect ? 'Des goht' : 'OK';
const rewardText = g => [g.coins ? fmt(g.coins) + ' Münzen' : '', g.pearls ? g.pearls + ' Seeperlen' : ''].filter(Boolean).join(' + ');

  .some(id => gupLevel(id) < metaDef(id).max && state.pearls >= gupCost(id));

function updateHUD() {
  $('coins').textContent = fmt(state.coins);
  $('pearls').textContent = fmt(state.pearls);

    $('gbText').textContent = full ? 'Das Luftschiff ist startklar!' : 'Belade das Luftschiff';
    $('gbSub').textContent = full ? 'Tippen, um nach ' + nextRegion().name + ' zu fliegen' : 'Ladung ' + pct(f) + ' % · Ziel: ' + nextRegion().name;

  }

    const [a, b] = goalProgress(first.g);

    $('gbSub').textContent = first.done ? 'Tippen, um ' + rewardText(first.g) + ' abzuholen' : (first.g.tip || 'Belohnung: ' + rewardText(first.g)) + (b > 1 ? ' · ' + fmt(Math.min(a, b)) + '/' + fmt(b) : '');
    $('gbBar').style.width = pct(clamp(a / b, 0, 1)) + '%';
  }
  $('dotGoals').classList.toggle('on', claimable);
  $('dotBalloons').classList.toggle('on', !!world.station && cargoFull(state.balloon, balloonNeed()));
  $('dotUpgrades').classList.toggle('on', metaAffordable());

}

function openSheet(html, refresh) {
