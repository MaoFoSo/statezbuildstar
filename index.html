function closeSheet() { sheet.classList.remove('open'); sheetRefresh = null; selected = null; }

const goodPill = (g, n) => `<span class="pill">${CONFIG.goods[g].icon} ${n !== undefined ? n + '× ' : ''}${CONFIG.goods[g].name}</span>`;
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`;
const pct = f => Math.round(f * 100);
const stars = l => `<div class="stars">${Array.from({ length: CONFIG.levels.max }, (_, i) => `<span class="${i < l ? 'on' : ''}"></span>`).join('')}</div>`;
function sheetHead(icon, bg, title, sub) {
  return `<div class="sheet-head"><div class="badge" style="background:${bg};font-size:28px">${icon}</div><div><h2>${title}</h2><p>${sub}</p></div></div>`;
}
// Kauf-Button mit "Es fehlen noch …"
function bindBuy(btnId, missId, costFn, buyFn) {
  $(btnId).onclick = () => { sound.unlock(); buyFn(); };
  return () => {
    const btn = $(btnId); if (!btn) return;
    const cost = costFn();
    const c = btn.querySelector('.cost'); if (c) c.textContent = fmt(cost);
    btn.disabled = state.coins < cost;
    if (missId) $(missId).textContent = btn.disabled ? 'Es fehlen noch ' + fmt(cost - state.coins) + ' Münzen' : '';
  };
}

const buildableKinds = o => world.region.buildings.filter(k => CONFIG.buildings[k].field === o.type);
function openOctSheet(o) {
  if (!o.unlocked) return openFogSheet(o);
  if (o.b) return openBuildingSheet(o);
  if (buildableKinds(o).length) return openPlotSheet(o);
  const ft = CONFIG.fieldTypes[o.type];
  openSheet(sheetHead(ft.icon, ft.top, ft.name, 'Feld ' + (o.col + 1) + '/' + (o.row + 1)) +
    `<div class="sheet-body"><div class="note">${ft.desc}</div></div><button class="secbtn" id="sheetClose">${T_OK()}</button>`);
  $('sheetClose').onclick = closeSheet;
}

function buildingStatus(o) {
  const b = o.b, d = def(b);
  if (b.k === 'balloon') {
    if (cargoFull(state.balloon, balloonNeed())) return ['ok', 'Der Ballon ist startklar!'];
    return state.balloon.load ? ['idle', 'Lädt Waren aus dem Lager …'] : ['bad', 'Umleiten ist aus – der Ballon wird nicht beladen.'];
  }
  if (b.k === 'ferry') return ['ok', 'Die Fähre bringt deine Waren ans andere Ufer.'];
  if (!d.out) return ['ok', 'Der Markt verkauft deine Waren automatisch.'];
  if (d.in && !b.a) {
    const noSup = Object.keys(d.in).filter(g => !regionProduces(g)).map(g => CONFIG.goods[g].name);
    if (noSup.length) return ['bad', 'Kein Lieferant: ' + noSup.join(', ') + (noSup.length > 1 ? ' werden' : ' wird') + ' noch nicht hergestellt.'];
    const miss = Object.keys(d.in).filter(g => (state.inventory[g] || 0) < d.in[g]).map(g => CONFIG.goods[g].name).join(', ');
    return ['bad', 'Wartet auf ' + miss + ' …'];
  }
  if (b.p >= 1 && !canAccept(d.out, d.in ? b.a : batchSize(b))) return ['bad', 'Lager voll – schalte Verkauf für ' + CONFIG.goods[d.out].name + ' ein.'];
  return ['ok', (d.in ? 'Verarbeitet ' + b.a + '× · ' : 'Produziert · ') + (isEnergy(d.out) ? 'Überschuss geht ins Netz' : state.market.sell[d.out] ? 'Überschuss wird verkauft' : 'wird eingelagert')];
}

function openHangarSheet(o) {
  const next = nextRegion(), A = world.region.airship;
  const head = sheetHead('🛫', CONFIG.fieldTypes.hangar.top, 'Luftschiffhalle', world.region.name + ' ist erkundet');
  if (!next || !A) {
    openSheet(head + `<div class="sheet-body"><div class="note">Das Luftschiff ist bereit – aber die nächste Region wird gerade noch vermessen. Sie folgt mit einem späteren Update. Bis dahin kannst du hier weiter ausbauen, Ballons starten und Seeperlen sammeln.</div></div>
      <button class="secbtn" id="sheetClose">${T_OK()}</button>`);
    $('sheetClose').onclick = closeSheet;
    return;
  }
  openSheet(head + `<div class="sheet-body">
      <div class="note">Belade das Luftschiff und fliege über den See nach <b>${next.name}</b>. Dort beginnst du neu: Münzen, Felder und Gebäude bleiben hier. <b>Seeperlen und globale Upgrades nimmst du mit.</b></div>
      <div class="cargo" id="airCargo"></div>
      <div class="kv"><span>Belohnung beim Abflug</span><b>${A.pearls} Seeperlen</b></div>
      <div class="row">Waren ans Luftschiff umleiten <button class="toggle ${state.airship.load ? 'on' : ''}" id="tAirLoad" aria-label="Luftschiff beladen"></button></div>
    </div>
    <button class="bigbtn" id="flyBtn" style="background:#2f7fb5;box-shadow:0 4px 0 #1d5a85">🛫 Abflug nach ${next.name}</button><div class="missing" id="flyMissing"></div>`);
  $('tAirLoad').onclick = e => { state.airship.load = !state.airship.load; e.currentTarget.classList.toggle('on', state.airship.load); updateReserve(); save(); };
  $('flyBtn').onclick = () => { sound.unlock(); openFlyConfirm(); };
  sheetRefresh = () => {
    const el = $('airCargo'); if (!el) return;
    const full = cargoFull(state.airship, A.need);
    el.innerHTML = `<div class="kv"><span>Ladung</span><b>${pct(cargoFrac(state.airship, A.need))} %</b></div>` + cargoRows(state.airship, A.need);
    $('flyBtn').disabled = !full;
    $('flyMissing').textContent = full ? '' : state.airship.load ? 'Das Luftschiff wird beladen …' : 'Umleiten ist aus.';
  };
  sheetRefresh();
}
function openFlyConfirm() {
  const next = nextRegion();
  openModal(`<h2>Abflug nach ${next.name}?</h2>
    <p class="hint">Du verlässt ${world.region.name}. Münzen, Felder, Gebäude, Waren und Ziele beginnen in der neuen Region von vorn.</p>
    <p class="hint">Du behältst: <b>${fmt(state.pearls)} Seeperlen</b> (+${world.region.airship.pearls}), alle globalen Upgrades und deine Einstellungen. Startkapital: <b>${fmt(next.startCoins + metaValue('startCoins'))} Münzen</b>.</p>
    <button class="bigbtn" id="flyYes" style="background:#2f7fb5;box-shadow:0 4px 0 #1d5a85">🛫 Leinen los!</button>
    <button class="secbtn" id="flyNo">Noch nicht</button>`);
  $('flyYes').onclick = () => { if (!tryLaunchAirship()) closeModal(); };
  $('flyNo').onclick = closeModal;
}

function openBuildingSheet(o) {
  const b = o.b, d = def(b), ft = CONFIG.fieldTypes[o.type], max = b.l >= CONFIG.levels.max;
  if (b.k === 'hangar') return openHangarSheet(o);
  let body = stars(b.l);
  if (b.k === 'balloon') {
    const C = CONFIG.balloon;
    body += kv('Ladetempo', C.rate[b.l - 1] + ' Waren/s' + (max ? '' : ` <span class="up">→ ${C.rate[b.l]}</span>`));
    body += kv('Nebelfelder pro Start', C.reveal[b.l - 1] + (max ? '' : ` <span class="up">→ ${C.reveal[b.l]}</span>`));
    body += kv('Seeperlen pro Start', '≥ ' + C.pearls[b.l - 1] + (max ? '' : ` <span class="up">→ ${C.pearls[b.l]}</span>`));
    body += `<div class="cargo" id="balloonCargo"></div>`;
    body += `<div class="row">Waren an Ballon umleiten <button class="toggle ${state.balloon.load ? 'on' : ''}" id="tLoad" aria-label="Ballon beladen"></button></div>`;
    body += `<button class="bigbtn" id="launchBtn" style="background:#e8735a;box-shadow:0 4px 0 #c0503f">🎈 Ballon starten</button>`;
  } else if (b.k === 'ferry') {
    const B = d.bonus;
    body += kv('Neue Märkte: Preise aller Waren', '+' + pct(B[b.l - 1]) + ' %' + (max ? '' : ` <span class="up">→ +${pct(B[b.l])} %</span>`));
    body += kv('Alle Fähren zusammen', '+' + pct(world.ferryMult - 1) + ' %');
  } else if (!d.out) {
    const M = CONFIG.market;
    const tm = regionMarket().tax;
    body += kv('Marktgebühren', fmtRate(M.tax[b.l - 1] * tm) + ' Münzen/s' + (max ? '' : ` <span class="up">→ ${fmtRate(M.tax[b.l] * tm)}</span>`));
    body += kv('Verkaufsbonus auf alle Waren', '+' + pct(M.bonus[b.l - 1]) + ' %' + (max ? '' : ` <span class="up">→ +${pct(M.bonus[b.l])} %</span>`));
  } else {
    const n = batchSize(b), cyc = cycleTime(b), G = CONFIG.goods[d.out];
    body += '<div class="io">' + (d.in ? Object.keys(d.in).map(g => goodPill(g, d.in[g] * n)).join('') + '<span class="arrow">→</span>' : '') +
      goodPill(d.out, n) + `<span class="arrow">alle ${fmtSec(cyc)}</span></div>`;
    const rate = n / cyc;
    let next = '';
    if (!max) { const nb = { ...b, l: b.l + 1 }; next = ` <span class="up">→ ${fmtRate(batchSize(nb) / cycleTime(nb))}</span>`; }
    body += kv(d.in ? 'Kapazität' : 'Produktion', fmtRate(rate) + ' ' + G.name + '/s' + next);
    body += kv('Wert bei Verkauf', '≈ ' + fmtRate(rate * sellPrice(d.out)) + ' Münzen/s');
  }
  body += '<div class="status" id="bStatus"></div>';
  openSheet(sheetHead(d.icon, ft.top, d.name, ft.name + ' · Stufe ' + b.l + ' von ' + CONFIG.levels.max) +
    `<div class="sheet-body">${body}</div>` +
    (max ? `<button class="bigbtn" disabled>Höchststufe erreicht ⭐</button><div class="missing"></div>`
      : `<button class="bigbtn" id="upBtn">Ausbauen auf Stufe ${b.l + 1} ${COIN_SVG}<span class="cost"></span></button><div class="missing" id="upMissing"></div>`));
  const refreshBuy = max ? () => {} : bindBuy('upBtn', 'upMissing', () => upgradeCost(b), () => { if (tryUpgrade(o)) { openBuildingSheet(o); updateHUD(); } });
  let refreshExtra = () => {};
  if (b.k === 'balloon') {
    $('tLoad').onclick = e => { state.balloon.load = !state.balloon.load; e.currentTarget.classList.toggle('on', state.balloon.load); updateReserve(); save(); };
    $('launchBtn').onclick = () => { sound.unlock(); const r = tryLaunchBalloon(); if (r) { closeSheet(); toast('Ballon gestartet: +' + fmt(r.coins) + ' Münzen, +' + r.pearls + ' Seeperlen'); updateHUD(); } };
    refreshExtra = () => {
      const need = balloonNeed(), full = cargoFull(state.balloon, need), r = balloonReward();
      const el = $('balloonCargo'); if (!el) return;
      el.innerHTML = `<div class="kv"><span>Ladung für Start ${state.balloon.launches + 1}</span><b>${pct(cargoFrac(state.balloon, need))} %</b></div>` + cargoRows(state.balloon, need) +
        `<div class="kv"><span>Belohnung</span><b>${fmt(r.coins)} Münzen · ${r.pearls} Seeperlen · ${r.reveal} Nebelfeld${r.reveal > 1 ? 'er' : ''}</b></div>`;
      $('launchBtn').disabled = !full;
    };
  }
  const refresh = () => {
    const [cls, txt] = buildingStatus(o), el = $('bStatus');
    if (el) { el.className = 'status ' + cls; el.textContent = txt; }
    refreshBuy(); refreshExtra();
  };
  sheetRefresh = refresh; refresh();
}
// Fortschritt einer Ladung (Ballon/Luftschiff) je Ware
function cargoRows(c, need) {
  return Object.keys(need).map(g => {
    const G = CONFIG.goods[g], have = Math.min(need[g], c.fill[g] || 0), ok = have >= need[g];
    return `<div class="goodrow"><div class="ic">${G.icon}</div><div class="mid">${G.name} <small>${fmt(have)} / ${fmt(need[g])}${ok ? ' ✓' : regionProduces(g) ? '' : ' · noch kein Lieferant'}</small>
      <div class="bar2 ${ok ? '' : 'red'}"><i style="width:${pct(have / need[g])}%"></i></div></div></div>`;
  }).join('');
}

function openPlotSheet(o) {
  const ft = CONFIG.fieldTypes[o.type];
  const kinds = buildableKinds(o);
  const cards = kinds.map(k => {
    const d = CONFIG.buildings[k];
    const ins = d.in ? Object.keys(d.in).map(g => `${d.in[g]}× ${CONFIG.goods[g].icon} ${CONFIG.goods[g].name}`).join(' + ') : '';
    const line = d.in ? `${ins} → ${CONFIG.goods[d.out].icon} ${CONFIG.goods[d.out].name} · ${fmtSec(d.cycle)}` : d.desc;
    return `<div class="card"><div class="ic">${d.icon}</div><div class="mid"><b>${d.name}</b>
      <small>${line}</small>
      <small id="hint_${k}"></small></div>
      <button id="build_${k}">${COIN_SVG}<span class="cost"></span></button></div>`;
  }).join('');
  openSheet(sheetHead(ft.icon, ft.top, ft.name, 'Was soll hier entstehen?') + `<div class="cards">${cards}</div>`);
  const refs = kinds.map(k => {
    const r = bindBuy('build_' + k, null, () => buildCost(k), () => { if (tryBuild(o, k)) { openBuildingSheet(o); updateHUD(); } });
    return () => {
      r();
      const d = CONFIG.buildings[k], h = $('hint_' + k); if (!h) return;
      if (atMax(k)) { h.className = 'warn'; h.textContent = d.max === 1 ? 'Nur eine pro Region – schon gebaut.' : `Höchstens ${d.max} pro Region – alle gebaut.`; $('build_' + k).querySelector('.cost').textContent = '✓'; return; }
      if (d.max > 1) { h.className = ''; h.textContent = `${countKind(k)} von ${d.max} gebaut`; return; }
      if (!d.in) { h.className = ''; h.textContent = ''; return; }
      const miss = Object.keys(d.in).filter(g => !regionProduces(g)), ok = !miss.length;
      h.className = ok ? '' : 'warn'; h.textContent = ok ? 'Wert: ' + fmtRate(sellPrice(d.out)) + ' Münzen/Stück' : 'Braucht ' + miss.map(g => CONFIG.goods[g].name).join(' und ') + ' – noch kein Lieferant';
    };
  });
  sheetRefresh = () => refs.forEach(f => f()); sheetRefresh();
}

function openFogSheet(o) {
  const ft = CONFIG.fieldTypes[o.type];
  if (isHangarField(o)) {
    openSheet(sheetHead('☁️', CONFIG.fog.top, 'Luftschiffplatz', 'Noch im Nebel') +
      `<div class="sheet-body"><div class="note">${ft.desc} Noch ${fieldCount() - unlockedCount()} Felder.</div></div><button class="secbtn" id="sheetClose">${T_OK()}</button>`);
    $('sheetClose').onclick = closeSheet;
    return;
  }
  const can = isUnlockable(o);
  openSheet(sheetHead('☁️', CONFIG.fog.top, 'Unerforschtes Gebiet', can ? 'Darunter liegt: ' + ft.name : 'Noch zu weit weg') +
    `<div class="sheet-body"><div class="note">${can ? ft.desc : 'Schalte zuerst ein angrenzendes Feld frei.'}</div></div>
    ${can ? `<button class="bigbtn" id="unlockBtn">Freischalten ${COIN_SVG}<span class="cost"></span></button><div class="missing" id="unlockMissing"></div>` : `<button class="secbtn" id="sheetClose">${T_OK()}</button>`}`);
  if (!can) { $('sheetClose').onclick = closeSheet; return; }
  sheetRefresh = bindBuy('unlockBtn', 'unlockMissing', unlockCost, () => { if (tryUnlock(o)) { selected = { kind: 'oct', ref: o }; openOctSheet(o); updateHUD(); } });
  sheetRefresh();
}

function openSquareSheet(sq) {
  const kind = squareKind(sq);
  const names = { fog: ['Nebelpfad', 'Wird sichtbar, sobald ein angrenzendes Feld frei ist.'], path: ['Feldweg', 'Verbindet Felder. Hier fahren die Karren deiner Lieferketten.'], road: ['Straße', 'Verbindung zwischen freien Feldern. Karren bringen hier Rohstoffe zu den Betrieben.'], buoy: ['Boje', 'Wasserweg für Boote.'] };
  const [n, d] = names[kind];
  openSheet(`<div class="sheet-head"><div class="badge" style="background:#eee2c2;font-size:26px">🛤️</div><div><h2>${n}</h2><p>Verbindungsfeld</p></div></div>
    <div class="sheet-body"><div class="note">${d}</div></div><button class="secbtn" id="sheetClose">${T_OK()}</button>`);
  $('sheetClose').onclick = closeSheet;
}

function openModal(html, refresh) {
  $('modalBox').innerHTML = html; $('modal').classList.add('open');
  modalRefresh = refresh || null; if (refresh) refresh();
}
function closeModal() { $('modal').classList.remove('open'); modalRefresh = null; }
$('modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });

// Angebot und Bedarf je Ware (Einheiten/s bei voller Auslastung)
function chainStats() {
  const sup = {}, dem = {};
  for (const o of world.prods.concat(world.procs)) {
    const b = o.b, d = def(b), rate = batchSize(b) / cycleTime(b);
    sup[d.out] = (sup[d.out] || 0) + rate;
    if (d.in) for (const g in d.in) dem[g] = (dem[g] || 0) + rate * d.in[g];
  }
  return { sup, dem };
}
function chainsHTML() {
  const { sup, dem } = chainStats();
  return world.region.chains.map(ch => {
    const warn = [];
    const pills = ch.map((g, i) => {
      const G = CONFIG.goods[g], s = sup[g] || 0, d = dem[g] || 0, bad = d > s * 1.02;
      if (bad) warn.push(`Engpass bei ${G.name}: Betriebe brauchen ${fmtRate(d)}/s, es kommen nur ${fmtRate(s)}/s.`);
      return (i ? '<span class="arrow">→</span>' : '') +
        `<span class="pill ${bad ? 'bad' : ''} ${s > 0 ? '' : 'off'}">${G.icon} ${G.name}<small>+${fmtRate(s)}/s${d ? ' · −' + fmtRate(d) + '/s' : ''}</small></span>`;
    }).join('');
    return `<div class="chain">${pills}${warn.map(w => `<div class="warnline">${w}</div>`).join('')}</div>`;
  }).join('');
}

function openMarket(tab = 'store') {
  const tabs = `<div class="tabs"><button id="tabStore" class="${tab === 'store' ? 'on' : ''}">Lager</button><button id="tabChains" class="${tab === 'chains' ? 'on' : ''}">Lieferketten</button></div>`;
  if (tab === 'chains') {
    openModal(`<h2>Lieferketten</h2>${tabs}
      <p class="hint">Produktion (+) und Bedarf der Verarbeiter (−) pro Sekunde bei voller Auslastung. Rot = Engpass: Baue mehr Lieferanten oder baue sie aus.</p>
      <div id="chainList">${chainsHTML()}</div>
      <button class="secbtn" id="closeMarket">${T_OK()}</button>`);
    $('tabStore').onclick = () => openMarket('store');
    $('closeMarket').onclick = closeModal;
    return;
  }
  const rows = regionGoods().map(g => {
    const G = CONFIG.goods[g];
    return `<div class="goodrow"><div class="ic">${G.icon}</div><div class="mid"><b>${G.name}</b><small id="inv_${g}"></small></div>
      ${isEnergy(g) ? '<span class="pill">Netz</span>' : `<button class="toggle ${state.market.sell[g] ? 'on' : ''}" id="sell_${g}" aria-label="${G.name} verkaufen"></button>`}</div>`;
  }).join('');
  openModal(`<h2>Lager & Markt</h2>${tabs}
    <p class="hint">Schalter an: Überschuss wird automatisch verkauft. Was deine Betriebe für die nächste Charge brauchen (und was der Ballon noch laden soll), bleibt immer im Lager. Schalter aus: alles wird eingelagert (max. ${storageCap()} pro Ware).</p>
    ${rows}
    <div class="kv"><span>Verkaufsbonus (Marktplatz)</span><b>+${pct(marketMult() - 1)} %</b></div>
    <div class="kv"><span>Insgesamt verdient</span><b id="earnedTotal"></b></div>
    <button class="secbtn" id="closeMarket">${T_OK()}</button>`, () => {
    for (const g of regionGoods()) {
      const el = $('inv_' + g); if (!el) continue;
      const res = world.reserve[g] ? ' · Reserve ' + world.reserve[g] : '';
      el.textContent = isEnergy(g) ? `Energie, nicht lagerbar${res ? ' · Puffer ' + world.reserve[g] : ''} · Netz zahlt ${fmtRate(sellPrice(g))} Münzen/Einheit`
        : `Lager ${fmt(state.inventory[g] || 0)}/${storageCap()}${res} · ${fmtRate(sellPrice(g))} Münzen/Stück`;
    }
    const e = $('earnedTotal'); if (e) e.textContent = fmt(state.stats.earned) + ' Münzen';
  });
  for (const g of regionGoods()) {
    if (isEnergy(g)) continue;
    $('sell_' + g).onclick = e => { state.market.sell[g] = !state.market.sell[g]; e.currentTarget.classList.toggle('on', state.market.sell[g]); save(); };
  }
  $('tabChains').onclick = () => openMarket('chains');
  $('closeMarket').onclick = closeModal;
}

function openUpgrades() {
  const M = CONFIG.meta;
  const card = (id, icon, title, sub) => `<div class="card"><div class="ic">${icon}</div><div class="mid"><b>${title}</b><small>${sub}</small><small id="gl_${id.replace(':', '_')}"></small></div>
    <button class="pearl" id="gb_${id.replace(':', '_')}">${PEARL_SVG}<span class="cost"></span></button></div>`;
  const goods = regionGoods().map(g => {
    const G = CONFIG.goods[g];
    return card('speed:' + g, G.icon, `${G.name} ${M.speed.icon} ${M.speed.name}`, `+${pct(M.speed.step)} % Tempo für alle Betriebe, die ${G.name} herstellen`) +
      card('price:' + g, G.icon, `${G.name} ${M.price.icon} ${M.price.name}`, `+${pct(M.price.step)} % Verkaufspreis`);
  }).join('');
  const special = Object.keys(M.special).map(id => card(id, M.special[id].icon, M.special[id].name, M.special[id].desc)).join('');
  const ids = Object.keys(M.special).concat(regionGoods().flatMap(g => ['speed:' + g, 'price:' + g]));
  openModal(`<h2>Globale Upgrades</h2>
    <p class="hint">Bezahlt mit Seeperlen ${PEARL_SVG.replace('class="ico"', 'class="ico" style="width:16px;height:16px;vertical-align:-3px"')} <b id="upPearls"></b>. Die Upgrades gelten für alle Felder dieser Ware und <b>bleiben in allen Regionen erhalten</b>.</p>
    <div class="cards">${special}${goods}</div>
    <button class="secbtn" id="closeUp">${T_OK()}</button>`, () => {
    $('upPearls').textContent = fmt(state.pearls);
    for (const id of ids) {
      const sid = id.replace(':', '_'), btn = $('gb_' + sid); if (!btn) continue;
      const lvl = gupLevel(id), max = metaDef(id).max, maxed = lvl >= max;
      btn.disabled = maxed || state.pearls < gupCost(id);
      btn.querySelector('.cost').textContent = maxed ? 'Max' : fmt(gupCost(id));
      $('gl_' + sid).textContent = 'Stufe ' + lvl + ' / ' + max + (lvl ? ' · aktiv: +' + (id.includes(':') ? pct(metaValue(id)) + ' %' : fmt(metaValue(id)) + (id === 'offline' ? ' h' : '')) : '');
    }
  });
  for (const id of ids) $('gb_' + id.replace(':', '_')).onclick = () => { sound.unlock(); if (tryBuyMeta(id)) { toast(metaDef(id).name + ' verbessert'); updateHUD(); } };
  $('closeUp').onclick = closeModal;
}

function openGoalsModal() {
  const goals = world.region.goals;
  const render = () => {
    const og = openGoals(), shown = og.slice(0, 4);
    const done = goals.length - og.length;
    const cards = shown.map(({ g, i, done }) => {
      const [a, b] = goalProgress(g);
      return `<div class="card ${done ? 'done' : ''}"><div class="ic">${done ? '✅' : '🎯'}</div><div class="mid"><b>${g.text}</b>
        <small>${g.tip || ''}</small><small>Belohnung: ${rewardText(g)}</small>
        <div class="bar2 pearl"><i style="width:${pct(clamp(a / b, 0, 1))}%"></i></div><small>${fmt(Math.min(a, b))} / ${fmt(b)}</small></div>
        <button id="claim_${i}" ${done ? '' : 'disabled'}>Abholen</button></div>`;
    }).join('');
    openModal(`<h2>Ziele · ${world.region.name}</h2>
      <p class="hint">${done} von ${goals.length} erledigt. Ziele bringen Seeperlen – und zeigen dir, wie es weitergeht.</p>
      <div class="cards">${cards || '<p class="hint center">Alle Ziele dieser Region sind erledigt! 🎉</p>'}</div>
      <button class="secbtn" id="closeGoals">${T_OK()}</button>`, () => {
      // neu erreichte Ziele freischalten, ohne das Modal neu aufzubauen
      for (const { g, i } of shown) { const btn = $('claim_' + i); if (btn) btn.disabled = !goalDone(g); }
    });
    for (const { i } of shown) $('claim_' + i).onclick = () => { if (claimGoal(i)) { toast('Belohnung: ' + rewardText(goals[i])); render(); updateHUD(); } };
    $('closeGoals').onclick = closeModal;
  };
  render();
}

function openBalloons() {
  if (world.station) {
    closeModal();
    selected = { kind: 'oct', ref: world.station };
    openBuildingSheet(world.station);
    focusAboveSheet(world.station);
    return;
  }
  const C = CONFIG.balloon;
  openModal(`<h2>🎈 Erkundungsballons</h2>
    <p class="hint">Baue auf einem Bauplatz eine <b>Ballonstation</b> (${fmt(CONFIG.buildings.balloon.build)} Münzen). Sie leitet Waren aus deinem Lager in einen Heißluftballon um.</p>
    <p class="hint">Jeder Start bringt Münzen, ${C.pearls[0]}+ <b>Seeperlen</b> und deckt ${C.reveal[0]}–${C.reveal[C.reveal.length - 1]} Nebelfelder kostenlos auf. Mit jedem Start wird die Ladung etwas größer.</p>
    <button class="secbtn" id="closeBal">${T_OK()}</button>`);
  $('closeBal').onclick = closeModal;
}

function openSettings() {
  const debug = location.hash.includes('debug');
  openModal(`<h2>Einstellungen</h2>
    <div class="row">Ton <button class="toggle ${state.settings.sound ? 'on' : ''}" id="tSound" aria-label="Ton"></button></div>
    <div class="row">Dialekt (Schwäbisch) <button class="toggle ${state.settings.dialect ? 'on' : ''}" id="tDialect" aria-label="Dialekt"></button></div>
    <button class="secbtn" id="exportBtn">Spielstand exportieren</button>
    <button class="secbtn" id="importBtn">Spielstand importieren</button>
    ${debug ? `<button class="secbtn" id="debugCoins">Debug: +${fmt(CONFIG.debugCoins)} Münzen</button><button class="secbtn" id="debugPearls">Debug: +10 Seeperlen</button><button class="secbtn" id="debugRegion">Debug: Region abschließen</button>` : ''}
    <button class="secbtn danger" id="resetBtn">Spielstand zurücksetzen</button>
    <button class="secbtn" id="closeSettings">${T_OK()}</button>`);
  $('tSound').onclick = e => { state.settings.sound = !state.settings.sound; e.currentTarget.classList.toggle('on', state.settings.sound); save(); };
  $('tDialect').onclick = e => { state.settings.dialect = !state.settings.dialect; e.currentTarget.classList.toggle('on', state.settings.dialect); save(); };
  $('exportBtn').onclick = openExport;
  $('importBtn').onclick = openImport;
  if (debug) {
    $('debugCoins').onclick = () => { state.coins += CONFIG.debugCoins; updateHUD(); toast('+' + fmt(CONFIG.debugCoins) + ' Münzen'); };
    $('debugPearls').onclick = () => { state.pearls += 10; updateHUD(); toast('+10 Seeperlen'); };
    $('debugRegion').onclick = () => {
      closeModal();
      for (const o of world.octs) if (!isHangarField(o)) { state.fields[o.id].u = 1; ensureProducer(o); }
      refreshWorld(); checkRegionComplete();
      if (world.region.airship) for (const g in world.region.airship.need) state.airship.fill[g] = world.region.airship.need[g];
      save();
    };
  }
  $('resetBtn').onclick = openResetConfirm;
  $('closeSettings').onclick = closeModal;
}

// Bestätigung im Spiel (confirm() ist in eingebetteten Ansichten oft gesperrt)
function openResetConfirm() {
  openModal(`<h2>Spielstand zurücksetzen?</h2>
    <p class="hint">Alle Felder, Gebäude, Münzen und Waren gehen verloren. Das lässt sich nicht rückgängig machen. Tipp: Exportiere vorher deinen Spielstand.</p>
    <button class="secbtn danger" id="resetYes">Ja, alles löschen</button>
    <button class="secbtn" id="resetNo">Abbrechen</button>`);
  $('resetYes').onclick = () => {
    try { localStorage.removeItem(CONFIG.saveKey); } catch (e) { /* ignorieren */ }
    startState(newState()); centerCamera(); save(); closeModal(); toast('Neues Spiel gestartet');
  };
  $('resetNo').onclick = openSettings;
}

function openExport() {
  save();
  const code = exportSave();
  openModal(`<h2>Spielstand exportieren</h2>
    <p class="hint">Kopiere diesen Text und bewahre ihn auf. Mit „Importieren“ kannst du ihn auf einem anderen Gerät laden.</p>
    <textarea id="exportText" readonly>${code}</textarea>
    <button class="secbtn" id="copyBtn">Kopieren</button>
    <button class="secbtn" id="backBtn">Zurück</button>`);
  $('copyBtn').onclick = async () => {
    const ta = $('exportText');
    try { await navigator.clipboard.writeText(code); toast('Kopiert'); }
    catch (e) { ta.focus(); ta.select(); try { document.execCommand('copy'); toast('Kopiert'); } catch (e2) { toast('Bitte manuell kopieren'); } }
  };
  $('backBtn').onclick = openSettings;
}
function openImport() {
  openModal(`<h2>Spielstand importieren</h2>
    <p class="hint">Füge einen exportierten Spielstand ein. Dein aktueller Spielstand wird dabei ersetzt.</p>
    <textarea id="importText" placeholder="Spielstand-Text hier einfügen …"></textarea>
    <div class="missing" id="importErr"></div>
    <button class="bigbtn" id="doImport">Laden</button>
    <button class="secbtn" id="backBtn">Zurück</button>`);
  $('doImport').onclick = () => {
    const s = importSave($('importText').value);
    if (!s) { $('importErr').textContent = 'Das ist kein gültiger Spielstand.'; return; }
    startState(s);
    if (state.camera) restoreCamera(); else centerCamera();
    save(); closeModal(); toast('Spielstand geladen');
  };
  $('backBtn').onclick = openSettings;
}

function showOffline(r) {
  const goods = Object.keys(r.goods).sort((a, b) => r.goods[b] * CONFIG.goods[b].price - r.goods[a] * CONFIG.goods[a].price)
    .slice(0, 4).map(g => goodPill(g, fmt(r.goods[g]))).join(' ');
  openModal(`<h2 class="center">Während du weg warst …</h2>
    <p class="hint center">… haben deine Betriebe ${fmtDuration(r.seconds)} lang weitergearbeitet.${r.capped ? `<br>(Abwesend: ${fmtDuration(r.away)} – angerechnet werden höchstens ${offlineCapHours()} h.)` : ''}</p>
    <div class="big-num">${COIN_SVG}+${fmt(r.coins)}</div>
    ${goods ? `<div class="io" style="justify-content:center">${goods}</div>` : ''}
    <button class="bigbtn" id="offlineOk">${state.settings.dialect ? 'Des goht' : 'Einsammeln'}</button>`);
  $('offlineOk').onclick = () => { closeModal(); sound.pling(990); };
}

function showRegionDone() {
  const next = nextRegion(), A = world.region.airship;
  const need = A ? Object.keys(A.need).map(g => goodPill(g, A.need[g])).join(' ') : '';
  openModal(`<h2 class="center">${world.region.name} ist erkundet! 🎉</h2>
    <p class="hint center">Alle Felder sind frei – die <b>Luftschiffhalle</b> ist erschienen.${next && A ? ` Belade das Luftschiff, um über den See nach <b>${next.name}</b> zu fliegen:` : ' Die nächste Region folgt mit einem späteren Update.'}</p>
    ${next && need ? `<div class="io" style="justify-content:center">${need}</div>` : ''}
    <button class="bigbtn" id="doneOk">${next && A ? 'Zur Halle' : T_OK()}</button>`);
  $('doneOk').onclick = () => { closeModal(); if (world.hangar && next) { selected = { kind: 'oct', ref: world.hangar }; openHangarSheet(world.hangar); focusAboveSheet(world.hangar); } };
  sound.pling(660); setTimeout(() => sound.pling(880), 120); setTimeout(() => sound.pling(1320), 240);
  vibrate([30, 60, 30, 60, 60]);
}

function showRegionIntro(pearls) {
  const R = world.region;
  openModal(`<h2 class="center">Willkommen: ${R.name}</h2>
    <p class="hint center">${R.intro || ''}</p>
    ${pearls ? `<div class="big-num">${PEARL_SVG}+${pearls}</div><p class="hint center">Seeperlen für die Ankunft. Deine globalen Upgrades gelten auch hier.</p>` : ''}
    <div class="io" style="justify-content:center">${R.chains.map(c => goodPill(c[c.length - 1])).join(' ')}</div>
    <button class="bigbtn" id="introOk">Los geht's</button>`);
  $('introOk').onclick = () => { closeModal(); sound.pling(990); };
}

let toastTimer = 0;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

document.querySelectorAll('#bottombar button').forEach(b => b.addEventListener('click', () => {
  sound.unlock();
  const act = b.dataset.act;
  if (act === 'settings') return openSettings();
  if (act === 'market') return openMarket();
  if (act === 'upgrades') return openUpgrades();
  if (act === 'goals') return openGoalsModal();
  if (act === 'balloons') return openBalloons();
}));
$('goalBanner').addEventListener('click', () => {
  sound.unlock();
  const first = openGoals()[0];
  if (first && first.done && claimGoal(first.i)) { toast('Belohnung: ' + rewardText(first.g)); updateHUD(); return; }
  if (!first && world.hangar) { selected = { kind: 'oct', ref: world.hangar }; openHangarSheet(world.hangar); focusAboveSheet(world.hangar); return; }
  openGoalsModal();
});

// Prozeduraler Ton (WebAudio)
const sound = {
  ctx: null,
  unlock() {
    if (this.ctx || !state.settings.sound) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) { try { this.ctx = new AC(); } catch (e) { this.ctx = null; } }
  },
  pling(freq = 880) {
    if (!state.settings.sound) return;
    this.unlock();
    const a = this.ctx; if (!a) return;
    if (a.state === 'suspended') a.resume();
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.08);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.4);
  },
};
function vibrate(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) { /* ignorieren */ } }

/* =====================================================================
 * 8. SAVE / LOAD
 * ===================================================================== */
const MIGRATIONS = {
  // v1 (M1: nur freigeschaltete Felder) → v2 (Wirtschaft). Gebäude auf Rohstofffeldern setzt buildWorld().
  1: s => {
    s.inventory = {};
    s.market = { sell: {} };
    s.stats = Object.assign({ unlocks: 0 }, s.stats, { earned: 0, produced: {}, regionDone: false });
    s.saveVersion = 2;
    return s;
  },
  // v2 → v3 (Meta): Upgrades, Ziele, Ballon, Lebenszeit-Statistik. Fehlende Felder ergänzt normalize().
  2: s => {
    s.lifetime = { earned: (s.stats && s.stats.earned) || 0, pearls: 0, launches: 0, regions: 0 };
    s.saveVersion = 3;
    return s;
  },
  // v3 → v4 (Luftschiff): airship ergänzt normalize(), die Halle stellt buildWorld() auf
  3: s => { s.saveVersion = 4; return s; },
};
function migrate(s) {
  while (s.saveVersion < CONFIG.saveVersion) {
    const m = MIGRATIONS[s.saveVersion];
    if (!m) throw new Error('Keine Migration für Version ' + s.saveVersion);
    s = m(s);
  }
  return s;
}
function normalize(s) {
  if (!s || typeof s !== 'object' || typeof s.saveVersion !== 'number' || !s.fields || typeof s.fields !== 'object') throw new Error('Ungültiger Spielstand');
  if (s.saveVersion > CONFIG.saveVersion) throw new Error('Spielstand aus neuerer Version');
  s = migrate(s);
  const ri = clamp(Math.floor(s.regionIndex) || 0, 0, CONFIG.regions.length - 1);
  const base = newState(ri);
  s = Object.assign(base, s);
  s.regionIndex = ri;
  for (const k of ['market', 'stats', 'settings', 'goals', 'balloon', 'airship', 'lifetime']) s[k] = Object.assign(newState(ri)[k], s[k]);
  if (!s.airship.fill || typeof s.airship.fill !== 'object') s.airship.fill = {};
  if (!s.market.sell) s.market.sell = {};
  if (!s.balloon.fill || typeof s.balloon.fill !== 'object') s.balloon.fill = {};
  if (!Array.isArray(s.goals.claimed)) s.goals.claimed = [];
  if (!s.globalUpgrades || typeof s.globalUpgrades !== 'object') s.globalUpgrades = {};
  if (!isFinite(s.coins)) s.coins = 0;
  if (!isFinite(s.pearls)) s.pearls = 0;
  return s;
}
function save() {
  if (!state) return;
  state.lastSeen = Date.now();
  state.camera = { x: cam.x, y: cam.y, zoom: cam.zoom / fitZoom };
  try { localStorage.setItem(CONFIG.saveKey, JSON.stringify(state)); } catch (e) { /* Speicher voll / privat */ }
}
function load() {
  try {
    const raw = localStorage.getItem(CONFIG.saveKey);
    if (!raw) return null;
    return normalize(JSON.parse(raw));
  } catch (e) {
    console.warn('Spielstand konnte nicht geladen werden', e);
    return null;
  }
}
function exportSave() { return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
function importSave(text) {
  try { return normalize(JSON.parse(decodeURIComponent(escape(atob(text.trim().replace(/\s+/g, '')))))); }
  catch (e) { console.warn('Import fehlgeschlagen', e); return null; }
}

/* =====================================================================
 * 9. MAIN LOOP & BOOT
 * ===================================================================== */
function centerCamera() {
  const t = world.octs.find(o => o.unlocked) || world.octs[0];
  cam.x = t.cx; cam.y = t.cy * T; cam.zoom = fitZoom * CONFIG.camera.startZoom;
  clampCamera();
}
function restoreCamera() {
  cam.x = state.camera.x; cam.y = state.camera.y; cam.zoom = state.camera.zoom * fitZoom; clampCamera();
}
// Neuen/geladenen Spielstand aktivieren
function startState(s) {
  state = s;
  buildWorld();
  resize();
  closeSheet();
  world.income = 0;
  updateHUD();
}
// Abwesenheit seit lastSeen nachholen und ggf. Dialog zeigen
function resumeFromAway() {
  const away = (Date.now() - (state.lastSeen || Date.now())) / 1000;
  if (away < 1) return;
  const r = catchUp(away);
  if (r.seconds > 0) world.income = Math.max(world.income, r.coins / r.seconds);
  updateHUD();
  if (r.seconds >= CONFIG.offline.minSeconds && r.coins >= 1) showOffline(r);
  save();
}

let acc = 0, lastFrame = performance.now(), hudTimer = 0, saveTimer = 0;
function frame(now) {
  let dt = Math.min(1, (now - lastFrame) / 1000);
  lastFrame = now;
  acc += dt;
  let ticks = 0;
  while (acc >= DT && ticks < CONFIG.maxTicksPerFrame) {
    const e = simTick(DT, false);
    world.income += (e / DT - world.income) * CONFIG.incomeSmoothing;
    acc -= DT; ticks++;
  }
  if (ticks === CONFIG.maxTicksPerFrame) acc = 0;

  if (cam.focus) { // Kamerafahrt
    const t = Math.min(1, (now - cam.focus.t0) / 300);
    cam.y = lerp(cam.focus.from, cam.focus.to, easeOut(t));
    if (t >= 1) cam.focus = null;
    clampCamera();
  }
  // Pan-Trägheit
  if (!gesture && (Math.abs(cam.vx) > 0.01 || Math.abs(cam.vy) > 0.01)) {
    cam.x += cam.vx; cam.y += cam.vy;
    cam.vx *= CONFIG.camera.friction; cam.vy *= CONFIG.camera.friction;
    clampCamera();
  }

  if (fx.flight && now - fx.flight.t0 >= fx.flight.dur) finishFlight();
  hudTimer += dt; if (hudTimer > 0.2) { hudTimer = 0; updateHUD(); }
  saveTimer += dt; if (saveTimer > CONFIG.autosaveSeconds) { saveTimer = 0; save(); }

  render(now);
  requestAnimationFrame(frame);
}

function boot() {
  const loaded = load();
  startState(loaded || newState());
  if (loaded && state.camera) restoreCamera(); else centerCamera();
  if (loaded) resumeFromAway();
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) save();
    else { resumeFromAway(); lastFrame = performance.now(); acc = 0; }
  });
  window.addEventListener('pagehide', save);
  $('loaderQuote').textContent = CONFIG.quotes[Math.floor(Math.random() * CONFIG.quotes.length)];
  setTimeout(() => $('loader').classList.add('hide'), 700);
  requestAnimationFrame(t => { lastFrame = t; frame(t); });
}
boot();
</script>
